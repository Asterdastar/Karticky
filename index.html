<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartičky</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0c22;
    --bg-soft:#13102a;
    --sidebar:#0a0818;
    --panel:#1a1738;
    --panel-2:#211d46;
    --field:#1e1a42;
    --field-border:#332e63;
    --border:#26224a;
    --accent:#5b5ff2;
    --accent-hover:#7276ff;
    --accent-soft:rgba(91,95,242,0.16);
    --text:#f2f1fa;
    --text-dim:#a8a4cb;
    --text-faint:#716d94;
    --danger:#f2703c;
    --success:#3ecf8e;
    --star:#f5c451;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --sidebar-w:240px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  ::selection{ background:var(--accent); color:#fff; }
  button{ font-family:inherit; }
  input, textarea, select{ font-family:inherit; }
  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:20px 14px 24px;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar.hidden-study{ display:none; }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 10px 18px;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:17px;
    letter-spacing:-0.02em;
  }
  .brand-mark .logo-dot{
    width:32px;height:32px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#9b6bff);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
    flex:0 0 auto;
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:10px;
    border:none;
    background:transparent;
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background:var(--panel-2); color:var(--text); }

  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:12px;
    color:var(--text-dim);
    text-decoration:none;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    border:none;
    background:transparent;
    width:100%;
    text-align:left;
  }
  .nav-item svg{ flex:0 0 auto; opacity:.9; }
  .nav-item:hover{ background:var(--panel-2); color:var(--text); }
  .nav-item.active{ background:var(--panel-2); color:var(--text); }
  .nav-item .badge{
    margin-left:auto;
    background:var(--accent);
    color:#fff;
    font-size:10.5px;
    font-weight:700;
    padding:1px 6px;
    border-radius:20px;
  }

  .sidebar-section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-faint);
    font-weight:700;
    padding:16px 12px 6px;
  }
  .sidebar-divider{
    height:1px;
    background:var(--border);
    margin:10px 4px;
  }
  .class-item{
    display:flex;align-items:center;gap:12px;
    padding:9px 12px;border-radius:12px;
    font-size:14px; font-weight:600; color:var(--text-dim);
    cursor:pointer; border:none; background:transparent; width:100%; text-align:left;
  }
  .class-item:hover, .class-item.active{ color:var(--text); }
  .class-item-wrap{ display:flex; align-items:center; gap:3px; width:100%; border-radius:12px; }
  .class-item-wrap:hover,.class-item-wrap.active{ background:var(--panel-2); }
  .class-item-wrap .class-item{ background:transparent; border-radius:12px; }
  .class-item-wrap .class-item{ flex:1; min-width:0; }
  .class-item > span:not(.class-icon){ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .class-icon{ width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto; }
  .class-actions{ display:flex; flex:0 0 auto; opacity:0; transition:opacity .15s ease; }
  .class-item-wrap:hover .class-actions, .class-item-wrap:focus-within .class-actions{ opacity:1; }
  .class-actions button{ width:26px; height:26px; border:0; border-radius:7px; background:transparent; color:var(--text-faint); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .class-actions button:hover{ background:var(--panel-2); color:var(--text); }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:28px 36px 60px;
  }
  .main.study-main{ padding:0; display:flex; flex-direction:column; min-height:100vh; }
  .main:not(.study-main) > *{ width:100%; max-width:1100px; margin-left:auto; margin-right:auto; }
  .mobile-nav-bar,.mobile-nav-scrim{ display:none; }

  .page-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .page-title{
    font-size:28px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  .page-sub{
    color:var(--text-dim);
    font-size:14.5px;
    margin:0;
    max-width:520px;
  }
  .btn{
    border:none;
    border-radius:12px;
    padding:11px 20px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .08s ease, background .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--accent); color:#fff; box-shadow:0 6px 18px -6px rgba(91,95,242,.65); }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:var(--panel-2); color:var(--text); }
  .btn-ghost:hover{ background:#2b2660; }
  .btn-outline{ background:transparent; color:var(--text-dim); border:1px solid var(--border); }
  .btn-outline:hover{ color:var(--text); border-color:var(--field-border); }
  .btn-danger-text{ background:transparent; color:var(--danger); padding:8px 10px; }
  .btn-danger{ background:#54271f; color:#ffc0a8; border:1px solid rgba(242,112,60,.35); }
  .btn-danger:hover{ background:#6b3024; color:#fff0e9; }
  .btn-sm{ padding:7px 13px; font-size:12.5px; border-radius:9px; }

  /* library grid */
  .set-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(255px, 1fr));
    gap:16px;
  }
  .library-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .library-grid:not(.list-view),.home-set-grid:not(.list-view){ grid-template-columns:repeat(2,minmax(0,1fr)); justify-content:stretch; }
  .library-grid:not(.list-view).single-set .set-card,.home-set-grid:not(.list-view).single-set .set-card{ grid-column:1/-1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); grid-template-rows:auto auto; align-items:center; gap:8px 16px; }
  .library-grid:not(.list-view).single-set .set-card-top,.home-set-grid:not(.list-view).single-set .set-card-top{ grid-column:1; grid-row:1; }
  .library-grid:not(.list-view).single-set .set-card-desc,.home-set-grid:not(.list-view).single-set .set-card-desc{ grid-column:2; grid-row:1; }
  .library-grid:not(.list-view).single-set .set-card-meta,.home-set-grid:not(.list-view).single-set .set-card-meta{ grid-column:1/-1; grid-row:2; flex-direction:row; align-items:center; justify-self:start; gap:12px; }
  .library-grid.list-view,.home-set-grid.list-view{ grid-template-columns:1fr; gap:8px; }
  .library-grid.list-view .set-card{ display:grid; grid-template-columns:minmax(130px,1.1fr) minmax(120px,1.5fr) minmax(160px,1fr); align-items:center; gap:12px; min-height:82px; padding:12px 16px; }
  @media (min-width: 901px){
    .library-grid.list-view .set-card{ grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1.25fr) auto; gap:16px; }
    .library-grid.list-view .set-card-top{ display:contents; }
    .library-grid.list-view .set-card-title{ grid-column:1; grid-row:1; }
    .library-grid.list-view .set-card-desc{ grid-column:2; grid-row:1; }
    .library-grid.list-view .set-card-meta{ grid-column:3; grid-row:1; }
    .library-grid.list-view .set-card-actions{ position:relative; top:auto; right:auto; grid-column:4; grid-row:1; justify-self:end; }
  }
  .home-set-grid.list-view .set-card{ display:grid; grid-template-columns:minmax(0,1fr) minmax(135px,.8fr); grid-template-rows:auto auto; align-items:center; gap:4px 14px; min-height:0; padding:12px 16px; }
  .home-set-grid.list-view .set-card-top{ display:contents; }
  .home-set-grid.list-view .set-card-title{ grid-column:1; grid-row:1; min-width:0; }
  .home-set-grid.list-view .set-card-actions{ position:relative; top:auto; right:auto; grid-column:2; grid-row:1; justify-self:end; }
  .home-set-grid.list-view .set-card-desc{ grid-column:1; grid-row:2; min-width:0; line-clamp:1; -webkit-line-clamp:1; }
  .home-set-grid.list-view .set-card-meta{ grid-column:2; grid-row:2; justify-self:end; align-items:flex-end; text-align:right; }
  .home-set-grid.list-view .set-card-meta-line,.home-set-grid.list-view .set-card-tags{ justify-content:flex-end; }
  .library-grid.list-view .set-card-desc,.home-set-grid.list-view .set-card-desc{ min-width:0; }
  .home-set-grid > .empty-state,.library-grid > .empty-state{ grid-column:1/-1; width:100%; max-width:none; margin:0; }
  .home-set-grid > .empty-state{ padding:34px 24px; }
  .subject-empty-actions{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .set-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:150px;
    transition:border-color .15s ease, transform .12s ease;
    position:relative;
  }
  .set-card:hover{ border-color:var(--field-border); transform:translateY(-2px); }
  .set-card.menu-open{ z-index:9; transform:none; }
  .set-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; min-width:0; }
  .set-card.has-actions .set-card-top{ padding-right:44px; }
  .set-card-title{ min-width:0; overflow-wrap:anywhere; font-weight:700; font-size:15.5px; line-height:1.3; margin:0; }
  .set-card-desc{ color:var(--text-dim); font-size:13px; line-height:1.5; margin:0; flex:1; overflow:hidden; display:-webkit-box; line-clamp:2; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .set-card-meta{ display:flex; flex-direction:column; align-items:flex-start; gap:7px; min-width:0; font-size:12px; color:var(--text-faint); font-weight:600; }
  .set-card-meta-line{ display:flex; align-items:center; gap:7px 12px; flex-wrap:wrap; min-width:0; }
  .set-card-meta-line > span{ white-space:nowrap; }
  .set-card-tags{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0; }
  .set-card-tag{ display:inline-flex; align-items:center; gap:4px; max-width:100%; overflow:hidden; background:var(--field); border-radius:20px; padding:3px 9px; color:var(--text-dim); text-overflow:ellipsis; white-space:nowrap; }
  .set-card-actions{ position:absolute; top:10px; right:10px; z-index:8; }
  .set-card-settings{ width:34px; height:34px; border:1px solid var(--field-border); border-radius:10px; background:var(--panel-2); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .set-card-settings:hover,.set-card-actions.open .set-card-settings{ border-color:var(--accent); background:var(--accent-soft); color:var(--text); }
  .set-card-settings-symbol{ font-family:'Segoe UI Symbol',sans-serif; font-size:20px; line-height:1; }
  .set-card-action-menu{ display:none; position:absolute; top:calc(100% + 6px); right:0; width:184px; padding:5px; border:1px solid var(--border); border-radius:11px; background:#080714; box-shadow:0 14px 28px rgba(0,0,0,.38); }
  .set-card-actions.open .set-card-action-menu{ display:flex; flex-direction:column; gap:2px; }
  .set-card-action-menu button{ width:100%; min-height:36px; display:flex; align-items:center; gap:9px; padding:7px 9px; border:0; border-radius:7px; background:transparent; color:var(--text-dim); font-family:inherit; font-size:12px; font-weight:600; text-align:left; cursor:pointer; }
  .set-card-action-menu button:hover{ background:var(--panel-2); color:var(--text); }
  .set-card-action-menu button[data-act="del"]{ color:#f29879; }
  .set-card-action-menu button[data-act="del"]:hover{ background:rgba(242,112,60,.14); color:var(--danger); }
  .library-toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .library-filter-wrap{ position:relative; }
  .library-filter-button{ width:40px; height:40px; border:1px solid var(--border); border-radius:10px; background:var(--panel); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .library-filter-button:hover,.library-filter-button[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--text); }
  .library-filter-popover{ display:none; position:fixed; z-index:300; width:min(340px,calc(100vw - 24px)); max-height:calc(100vh - 24px); overflow-y:auto; padding:14px; border:1px solid var(--field-border); border-radius:12px; background:var(--panel); box-shadow:0 16px 38px rgba(0,0,0,.38); }
  .library-filter-wrap.open .library-filter-popover{ display:grid; gap:12px; }
  .library-filter-field{ display:flex; flex-direction:column; gap:6px; color:var(--text-dim); font-size:12px; font-weight:700; }
  .library-filter-field .field-box{ min-height:42px; margin:0; }
  .library-filter-footer{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .empty-state{
    border:1.5px dashed var(--border);
    border-radius:var(--radius-lg);
    padding:60px 30px;
    text-align:center;
    color:var(--text-dim);
    max-width:760px;
    margin:0 auto;
  }
  .empty-state h3{ color:var(--text); margin:14px 0 6px; font-size:18px; }
  .empty-state p{ margin:0 0 18px; font-size:14px; }

  /* ---------- Create page ---------- */
  .create-wrap{ max-width:1300px; width:100%; margin:0 auto; }
  .editor-layout{ display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:22px; align-items:start; }
  .editor-cards-column{ min-width:0; }
  .section-panel{ position:sticky; top:16px; min-width:0; padding:14px; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--panel); }
  .editor-layout > .section-panel{ top:12px; max-height:calc(100vh - 24px); display:flex; flex-direction:column; overflow:hidden; }
  .editor-layout > .section-panel.has-many-sections[open]{ height:min(760px,calc(100vh - 24px)); }
  .section-panel > summary{ display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--text); font-size:14px; font-weight:800; line-height:1.35; cursor:pointer; list-style:none; flex:0 0 auto; }
  .section-panel > summary::-webkit-details-marker{ display:none; }
  .section-panel > summary::after,.section-tree-node > summary::before,.editor-section-group > summary::before{ content:''; width:8px; height:8px; border-right:2px solid var(--text-faint); border-bottom:2px solid var(--text-faint); flex:0 0 auto; transform:rotate(45deg); transition:transform .15s ease; }
  .section-panel:not([open]) > summary::after,.section-tree-node:not([open]) > summary::before,.editor-section-group:not([open]) > summary::before{ transform:rotate(-45deg); }
  .section-panel > summary::after{ margin-left:auto; }
  .section-panel-content{ padding-top:12px; }
  .editor-layout > .section-panel.has-many-sections[open] > .section-panel-content{ height:min(680px,calc(100vh - 100px)); max-height:min(680px,calc(100vh - 100px)); min-height:0; flex:1 1 0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--field-border) transparent; }
  .editor-layout > .section-panel[open] > .section-panel-content::-webkit-scrollbar{ width:7px; }
  .editor-layout > .section-panel[open] > .section-panel-content::-webkit-scrollbar-thumb{ border-radius:8px; background:var(--field-border); }
  .section-tree{ display:flex; flex-direction:column; gap:5px; }
  .section-tree-node{ min-width:0; }
  .section-tree-node > summary{ display:flex; align-items:center; gap:8px; min-height:36px; color:var(--text-dim); font-size:13px; line-height:1.35; cursor:pointer; list-style:none; }
  .section-tree-node > summary::-webkit-details-marker{ display:none; }
  .section-tree-node > summary::before{ margin:0 2px; }
  .section-tree-row{ display:flex; align-items:center; gap:8px; min-height:36px; color:var(--text); font-size:13px; line-height:1.35; font-weight:600; }
  .section-tree-children > .section-tree-node > summary,.section-tree-children > .section-tree-node > .section-tree-row{ font-size:12.5px; color:var(--text-dim); font-weight:500; }
  .section-tree-children > .section-tree-node > .section-tree-children > .section-tree-node.section-tree-leaf > .section-tree-row{ color:var(--text); font-size:13.5px; font-weight:600; }
  .section-tree-leaf > .section-tree-row::before{ content:''; width:8px; height:8px; margin:0 2px; flex:0 0 auto; }
  .section-tree-children{ margin-left:9px; padding-left:10px; border-left:1px solid var(--border); }
  .section-tree-label{ min-width:0; overflow-wrap:anywhere; flex:1; }
  .section-tree-count{ color:var(--text-faint); font-size:11px; font-variant-numeric:tabular-nums; }
  .section-tree-actions{ display:flex; gap:3px; }
  .section-tree-actions button{ width:28px; height:28px; border:0; border-radius:8px; background:transparent; color:var(--text-faint); font-size:15px; cursor:pointer; }
  .section-tree-actions button:hover{ background:var(--panel-2); color:var(--text); }
  .section-delete-actions{ display:grid; gap:8px; }
  .section-delete-choice-row{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .section-delete-choice-row .btn{ justify-content:center; text-align:center; white-space:normal; }
  .section-delete-cancel-row{ display:flex; justify-content:flex-end; }
  .section-tree-check{ width:16px; height:16px; accent-color:var(--accent); flex:0 0 auto; }
  .section-panel-actions{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:12px; }
  .section-panel-actions .btn{ justify-content:center; white-space:normal; }
  .section-panel-empty{ margin:0; color:var(--text-faint); font-size:12px; line-height:1.5; }
  .editor-section-list{ display:flex; flex-direction:column; gap:22px; }
  .editor-section-group{ min-width:0; padding:4px 0 14px; }
  .editor-section-group > summary{ display:flex; align-items:center; gap:12px; min-height:56px; padding:12px 14px; margin-bottom:8px; border-radius:10px; color:var(--text); font-size:15px; font-weight:800; cursor:pointer; list-style:none; }
  .editor-section-group > summary::-webkit-details-marker{ display:none; }
  .editor-section-group > summary:hover{ background:var(--panel); }
  .editor-section-group > summary::before{ width:7px; height:7px; border-color:var(--accent-hover); }
  .editor-section-group[data-depth="1"] > summary{ font-size:13px; color:var(--text-dim); }
  .editor-section-group[data-depth="1"] > summary::before{ border-color:var(--text-faint); }
  .editor-section-group[data-depth="2"] > summary{ font-size:12px; color:var(--text-dim); }
  .editor-section-group[data-depth="2"] > summary::before{ width:6px; height:6px; }
  .editor-section-name{ min-width:0; flex:1; overflow-wrap:anywhere; }
  .editor-section-count{ color:var(--text-faint); font-size:11px; font-weight:600; }
  .editor-section-children{ display:flex; flex-direction:column; gap:14px; margin:12px 0 4px 20px; padding:4px 0 4px 16px; border-left:1px solid var(--border); }
  .editor-section-content > .card-row{ margin:14px 10px 22px; padding:22px 22px 18px; }
  .editor-section-add{ margin:2px 10px 8px; }
  .editor-section-add-actions{ display:flex; flex-wrap:wrap; gap:8px; margin:2px 10px 8px; }
  .editor-unassigned{ margin-top:22px; padding:16px; border:1px solid var(--border); border-radius:var(--radius-lg); background:rgba(26,23,56,.4); }

const CARD_IMAGE_BUCKET = 'flashcard-images';
const cardImageUploadCache = new Map();

function getCardImageExtension(contentType){
  const extensions = {
    'image/avif':'avif',
    'image/bmp':'bmp',
    'image/gif':'gif',
    'image/jpeg':'jpg',
    'image/png':'png',
    'image/svg+xml':'svg',
    'image/webp':'webp',
  };
  return extensions[contentType] || 'img';
}

async function uploadCardImage(image,userId){
  if(typeof image !== 'string' || !image.startsWith('data:image/')) return image;
  if(!supabaseClient?.storage) throw new Error('Úložiště obrázků není dostupné. Obnov stránku a zkus uložení znovu.');
  if(typeof crypto === 'undefined' || !crypto.subtle) throw new Error('Prohlížeč nepodporuje bezpečné ukládání obrázků. Aktualizuj ho a zkus to znovu.');
  const response = await fetch(image);
  if(!response.ok) throw new Error('Obrázek se nepodařilo připravit k nahrání.');
  const blob = await response.blob();
  const digest = await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());
  const hash = Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('');
  const path = `${userId}/${hash}.${getCardImageExtension(blob.type)}`;
  const cacheKey = `${CARD_IMAGE_BUCKET}/${path}`;
  if(!cardImageUploadCache.has(cacheKey)){
    const upload = (async()=>{
      const { error } = await supabaseClient.storage.from(CARD_IMAGE_BUCKET).upload(path,blob,{
        cacheControl:'31536000',
        contentType:blob.type,
        upsert:false,
      });
      const alreadyExists = error && (error.statusCode === '409' || error.status === 409 || error.code === 'Duplicate' || /already exists|duplicate/i.test(error.message || ''));
      if(error && !alreadyExists) throw new Error(`Nahrání obrázku se nezdařilo: ${error.message}`);
      return supabaseClient.storage.from(CARD_IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
    })();
    cardImageUploadCache.set(cacheKey,upload);
    upload.catch(()=>cardImageUploadCache.delete(cacheKey));
  }
  return cardImageUploadCache.get(cacheKey);
}

async function preparePayloadImages(payload,userId){
  const storedPayload = JSON.parse(JSON.stringify(payload));
  const storageOwnerId = currentUser?.id || userId;
  const imageSlots = [];
  for(const set of storedPayload.sets || []){
    for(const card of set.cards || []){
      for(const key of ['questionImage','termImage','defImage','image']){
        if(typeof card[key] === 'string' && card[key].startsWith('data:image/')) imageSlots.push({ target:card, key });
      }
      for(const option of card.options || []){
        if(typeof option.image === 'string' && option.image.startsWith('data:image/')) imageSlots.push({ target:option, key:'image' });
      }
    }
  }
  for(let offset=0;offset<imageSlots.length;offset+=6){
    await Promise.all(imageSlots.slice(offset,offset+6).map(async slot=>{
      slot.target[slot.key] = await uploadCardImage(slot.target[slot.key],storageOwnerId);
    }));
  }
  return storedPayload;
}

async function persistCloudPayload(payload,userId){
  if(!supabaseClient || currentUser?.id !== userId) return { saved:false, warning:'Relace se změnila. Obnov stránku, přihlas se znovu a zkus uložení zopakovat.' };
  let storedPayload;
  try{
    storedPayload = await preparePayloadImages(payload,userId);
  }catch(error){
    return { saved:false, warning:'Uložení obrázků se nezdařilo: ' + (error?.message || 'Zkontroluj nastavení úložiště a zkus to znovu.') };
  }
  let saveError = null;
  for(let attempt=0;attempt<3;attempt++){
    const { error } = await supabaseClient.from('flashcard_data').upsert({ user_id:userId, payload:storedPayload, updated_at:new Date().toISOString() });
    if(!error){ saveError = null; break; }
    saveError = error;
    const timedOut = error.code === '57014' || /statement timeout|canceling statement/i.test(error.message || '');
    if(!timedOut || attempt === 2) break;
    await new Promise(resolve => setTimeout(resolve,300*(attempt+1)));
  }
  if(saveError) return { saved:false, warning:'Uložení se nezdařilo: ' + saveError.message };

  const warning = message => showToast('Data byla uložena, ale ' + message);
  const marketplaceRows = storedPayload.sets.map(set => ({
    owner_id:userId,
    set_id:set.id,
    set_type:getSetType(set),
    title:set.title || 'Bez názvu',
    description:set.description || '',
    subject_code:(set.subjectCode || '').trim().toUpperCase(),
    subject_id:set.className && storedPayload.classVisibility[set.className] === true ? set.className : null,
    cards:set.cards || [],
    sections:set.sections || [],
    is_public:set.isPublic === true,
    updated_at:new Date().toISOString(),
  }));
  if(marketplaceRows.length){
    const { error:marketplaceError } = await supabaseClient.from('marketplace_sets').upsert(marketplaceRows);
    if(marketplaceError){ warning('Burza se nepodařila synchronizovat: ' + marketplaceError.message); return { saved:true, warning:'Burza se nepodařila synchronizovat.' }; }
  }
  const subjectRows = storedPayload.classes.map(name => ({
    owner_id:userId,
    subject_id:name,
    name,
    icon:storedPayload.classIcons[name] || '📚',
    is_public:storedPayload.classVisibility[name] === true,
    updated_at:new Date().toISOString(),
  }));
  if(subjectRows.length){
    const { error:subjectError } = await supabaseClient.from('marketplace_subjects').upsert(subjectRows);
    if(subjectError){ warning('Předměty se nepodařilo synchronizovat. Spusť aktualizovaný admin-setup.sql.'); return { saved:true, warning:'Předměty se nepodařilo synchronizovat.' }; }
  }
  const { data:ownedSubjects, error:ownedSubjectsError } = await supabaseClient.from('marketplace_subjects').select('subject_id').eq('owner_id',userId);
  if(ownedSubjectsError){ warning('Kontrola předmětů se nezdařila: ' + ownedSubjectsError.message); return { saved:true, warning:'Kontrola předmětů se nezdařila.' }; }
  const activeSubjects = new Set(storedPayload.classes);
  const removedSubjects = (ownedSubjects || []).map(row => row.subject_id).filter(name => !activeSubjects.has(name));
  if(removedSubjects.length){
    const { error:removeSubjectError } = await supabaseClient.from('marketplace_subjects').delete().eq('owner_id',userId).in('subject_id',removedSubjects);
    if(removeSubjectError) warning('Odstranění předmětu z burzy se nezdařilo: ' + removeSubjectError.message);
  }
  const { data:ownedRows, error:ownedError } = await supabaseClient.from('marketplace_sets').select('set_id').eq('owner_id',userId);
  if(ownedError){ warning('Kontrola burzy se nezdařila: ' + ownedError.message); return { saved:true, warning:'Kontrola burzy se nezdařila.' }; }
  const activeIds = new Set(storedPayload.sets.map(set => set.id));
  const removedIds = (ownedRows || []).map(row => row.set_id).filter(setId => !activeIds.has(setId));
  if(removedIds.length){
    const { error:removeError } = await supabaseClient.from('marketplace_sets').delete().eq('owner_id',userId).in('set_id',removedIds);
    if(removeError) warning('Odstranění sady z burzy se nezdařilo: ' + removeError.message);
  }
  return { saved:true, warning:'' };
}

async function flushCloudSave(){
  clearTimeout(cloudSaveTimer);
  if(!supabaseClient || !currentUser) return { saved:false, warning:'Nejsi přihlášený. Přihlas se a zkus sadu uložit znovu.' };
  try{
    await cloudSaveQueue.catch(()=>{});
    return await enqueueCloudSave(getCloudPayload(),currentUser.id);
  }catch(error){
    return { saved:false, warning:'Uložení se nezdařilo: ' + (error?.message || 'Zkontroluj připojení a zkus to znovu.') };
  }
}

function enqueueCloudSave(payload,userId){
  const save = cloudSaveQueue.catch(()=>{}).then(()=>persistCloudPayload(payload,userId));
  cloudSaveQueue = save;
  return save;
}

function scheduleCloudSave(){
  if(!supabaseClient || !currentUser) return;
  const userId = currentUser.id;
  const payload = getCloudPayload();
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    if(currentUser?.id !== userId) return;
    try{
      const result = await enqueueCloudSave(payload,userId);
      if(!result.saved) showToast(result.warning || 'Synchronizace se nezdařila.');
    }catch(error){
      showToast('Synchronizace se nezdařila: ' + (error?.message || 'Zkontroluj připojení.'));
    }
  }, 500);
}

  app.innerHTML = `

        <h1>${signingUp?'Vytvořit účet':'Přihlášení'}</h1>

        <form class="auth-form" id="authForm">
          <label>E-mail<input id="authEmail" type="email" autocomplete="email" required></label>
          <label>Heslo<input id="authPassword" type="password" autocomplete="${signingUp?'new-password':'current-password'}" minlength="6" required></label>
          <div class="auth-message ${isError?'error':''}" role="status">${escapeHtml(message)}</div>
          <button class="btn btn-primary" type="submit" ${configured?'':'disabled'}>${signingUp?'Vytvořit účet':'Přihlásit se'}</button>
        </form>
        <button class="auth-switch" id="authSwitch">${signingUp?'Už máš účet? Přihlásit se':'Nemáš účet? Vytvořit účet'}</button>
        ${configured?'':'<p class="auth-config">Pro zapnutí přihlašování nastav v tomto HTML hodnoty SUPABASE_URL a SUPABASE_ANON_KEY a vytvoř tabulku podle návodu v odpovědi.</p>'}
      </section>
    </main>`;
  document.getElementById('authSwitch').onclick = () => { authView = signingUp?'login':'signup'; renderAuth(); };
  document.getElementById('authForm').onsubmit = async event => {
    event.preventDefault();
    if(!supabaseClient){ renderAuth('Supabase není nastavený.', true); return; }
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const submit = document.querySelector('#authForm button[type="submit"]');
    submit.disabled = true;
    document.querySelector('.auth-message').textContent = 'Ověřuji údaje…';
    const result = signingUp
      ? await supabaseClient.auth.signUp({ email, password })
      : await supabaseClient.auth.signInWithPassword({ email, password });
    if(result.error){ renderAuth(result.error.message, true); return; }
    if(signingUp && !result.data.session){
      renderAuth('Účet je vytvořený. Potvrď registraci přes odkaz v e-mailu a potom se přihlas.');
    }
  };
}

async function activateSession(session){
  const user = session?.user || null;
  if(authReady && currentUser?.id === user?.id) return;
  const loadId = ++authLoadId;
  currentUser = user;
  authReady = false;
  if(!user){
    isAdmin = false;
    loadData(null, false);
    authReady = true;
    render();
    return;
  }
  const { data: roleRow } = await supabaseClient.from('user_roles').select('role').eq('user_id', user.id).maybeSingle();
  if(loadId !== authLoadId) return;
  isAdmin = roleRow?.role === 'admin';
  const { data, error } = await supabaseClient.from('flashcard_data').select('payload').eq('user_id', user.id).maybeSingle();
  if(loadId !== authLoadId) return;
  if(error){
    loadData(null, false);
    showToast('Načtení dat se nezdařilo: ' + error.message);
  }else if(data?.payload){
    loadData(data.payload);
  }else{
    const useLegacy = localStorage.getItem(LEGACY_MIGRATED_KEY) !== 'true';
    loadData(null, useLegacy);
    if(useLegacy){
      localStorage.setItem(LEGACY_MIGRATED_KEY, 'true');
    }
  }
  scheduleCloudSave();
  authReady = true;
  render();
}

async function initializeAuth(){
  const configured = !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
  if(!configured){
    authReady = true;
    renderAuth('');
    return;
  }
  if(!window.supabase?.createClient){
    authReady = true;
    renderAuth('Knihovna Supabase se nenačetla. Zkontroluj připojení k internetu a obnov stránku.', true);
    return;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data, error } = await supabaseClient.auth.getSession();
  if(error){
    authReady = true;
    renderAuth(error.message, true);
    return;
  }
  await activateSession(data.session);
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    setTimeout(() => activateSession(session), 0);
  });
}

async function loadAdminContent(container){
  container.innerHTML = '<p class="page-sub">Načítám účty…</p>';
  const [usersResult, recordsResult] = await Promise.all([
    supabaseClient.functions.invoke('rapid-task', { body:{ action:'list-users' } }),
    supabaseClient.from('flashcard_data').select('user_id,payload,updated_at'),
  ]);
  if(!container.isConnected) return;
  if(usersResult.error){
    container.innerHTML = `<p class="admin-error">${escapeHtml(usersResult.error.message)}. Zkontroluj nasazení Edge Function rapid-task.</p>`;
    return;
  }
  if(recordsResult.error){
    container.innerHTML = `<p class="admin-error">${escapeHtml(recordsResult.error.message)}. Zkontroluj admin RLS pravidla.</p>`;
    return;
  }
  const users = usersResult.data?.users || [];
  const records = recordsResult.data || [];
  const recordsByUser = new Map(records.map(record => [record.user_id, record]));
  if(users.length === 0){
    container.innerHTML = '<div class="empty-state"><h3>Zatím tu nejsou žádné účty</h3></div>';
    return;
  }
  container.innerHTML = `
    <div class="admin-table-wrap"><table class="admin-table">
      <thead><tr><th>Účet</th><th>Vytvořen</th><th>Obsah</th><th>Stav</th><th>Akce</th></tr></thead>
      <tbody>${users.map(user => {
        const record = recordsByUser.get(user.id);
        const payload = record?.payload || {};
        const sets = Array.isArray(payload.sets) ? payload.sets : [];
        const cards = sets.reduce((total, set) => total + (Array.isArray(set.cards) ? set.cards.length : 0), 0);
        const isBanned = user.bannedUntil && Date.parse(user.bannedUntil) > Date.now();
        return `<tr>
          <td><strong>${escapeHtml(user.email || 'Bez e-mailu')}</strong><small>${escapeHtml(user.id)}</small></td>
          <td>${escapeHtml(formatDate(Date.parse(user.createdAt)))}</td>
          <td>${sets.length} sad · ${cards} položek</td>
          <td><span class="admin-status ${isBanned?'blocked':''}">${isBanned?'Zablokován':'Aktivní'}</span></td>
          <td><div class="admin-actions"><button class="btn btn-ghost btn-sm" data-edit-user="${escapeHtml(user.id)}">Upravit data</button><button class="btn ${isBanned?'btn-primary':'btn-outline'} btn-sm" data-ban-user="${escapeHtml(user.id)}" data-banned="${isBanned?'true':'false'}">${isBanned?'Obnovit':'Zablokovat'}</button></div></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  container.querySelectorAll('[data-edit-user]').forEach(button => {
    button.onclick = () => openAdminPayloadEditor(button.dataset.editUser, recordsByUser.get(button.dataset.editUser)?.payload || null, users.find(user => user.id === button.dataset.editUser)?.email || '');
  });
  container.querySelectorAll('[data-ban-user]').forEach(button => {
    button.onclick = () => setAdminBan(button.dataset.banUser, button.dataset.banned !== 'true', container);
  });
}

async function loadAdminSets(container){
  container.innerHTML = '<p class="page-sub">Načítám sady…</p>';
  const [usersResult, recordsResult] = await Promise.all([
    supabaseClient.functions.invoke('rapid-task', { body:{ action:'list-users' } }),
    supabaseClient.from('flashcard_data').select('user_id,payload,updated_at'),
  ]);
  if(!container.isConnected) return;
  if(usersResult.error){
    container.innerHTML = `<p class="admin-error">${escapeHtml(usersResult.error.message)}. Zkontroluj nasazení Edge Function rapid-task.</p>`;
    return;
  }
  if(recordsResult.error){
    container.innerHTML = `<p class="admin-error">${escapeHtml(recordsResult.error.message)}. Zkontroluj admin RLS pravidla.</p>`;
    return;
  }

  const users = usersResult.data?.users || [];
  const usersById = new Map(users.map(user => [user.id, user]));
  const recordsByUser = new Map((recordsResult.data || []).map(record => [record.user_id, record]));
  const sets = [];
  recordsByUser.forEach((record, userId) => {
    const user = usersById.get(userId);
    (Array.isArray(record.payload?.sets) ? record.payload.sets : []).forEach(set => {
      sets.push({ userId, userEmail:user?.email || 'Bez e-mailu', record, set });
    });
  });
  sets.sort((a,b) => (a.set.title || '').localeCompare(b.set.title || '', 'cs'));

  container.innerHTML = `
    <div class="admin-set-toolbar">
      <p class="admin-set-count" id="adminSetCount"></p>
      <div class="admin-filter-wrap" id="adminSetFilterWrap">
        <button type="button" class="admin-filter-button" id="adminSetFilterToggle" aria-label="Otevřít filtry sad" title="Filtry" aria-expanded="false" aria-pressed="false">${icon('filter',18)}</button>
        <div class="admin-set-filter-popover" id="adminSetFilterPopover">
          <label class="admin-set-filter-field">Hledat sady<input class="field-box" id="adminSetSearch" type="search" placeholder="Název, popis nebo předmět…"></label>
          <label class="admin-set-filter-field">Vlastník${filterPickerMarkup('adminSetOwnerPicker','Vlastník',[{value:'',label:'Všichni vlastníci'},...users.map(user=>({value:user.id,label:user.email||'Bez e-mailu'}))],'','Filtrovat podle vlastníka')}</label>
          <div class="admin-set-filter-actions"><span class="admin-set-count" id="adminSetFilterCount"></span><button type="button" class="btn btn-outline btn-sm" id="clearAdminSetFilters">Vymazat</button></div>
        </div>
      </div>
    </div>
    <div class="admin-table-wrap"><table class="admin-table">
      <thead><tr><th>Sada</th><th>Vlastník</th><th>Předmět</th><th>Položky</th><th>Akce</th></tr></thead>
      <tbody id="adminSetsBody"></tbody>
    </table></div>`;

  const searchInput = container.querySelector('#adminSetSearch');
  const ownerPicker = container.querySelector('#adminSetOwnerPicker');
  let ownerId = '';
  const filterWrap = container.querySelector('#adminSetFilterWrap');
  const filterToggle = container.querySelector('#adminSetFilterToggle');
  const filterCount = container.querySelector('#adminSetFilterCount');
  const tbody = container.querySelector('#adminSetsBody');
  const count = container.querySelector('#adminSetCount');
  const ownerPickerControl = bindFilterPicker(ownerPicker,value => {
    ownerId = value;
    renderRows();
  });
  const renderRows = () => {
    const query = searchInput.value.trim().toLocaleLowerCase('cs');
    const filtered = sets.filter(item => {
      if(ownerId && item.userId !== ownerId) return false;
      const searchable = [item.set.title,item.set.description,item.set.className,item.set.subjectCode,item.userEmail].join(' ').toLocaleLowerCase('cs');
      return !query || searchable.includes(query);
    });
    count.textContent = `${filtered.length} z ${sets.length} sad`;
    const activeFilters = Number(Boolean(query)) + Number(Boolean(ownerId));
    filterCount.textContent = activeFilters ? `${activeFilters} aktivní filtr${activeFilters===1?'':'y'}` : 'Bez filtrů';
    filterToggle.setAttribute('aria-pressed',String(activeFilters>0));
    tbody.innerHTML = filtered.length ? filtered.map(item => `<tr>
      <td class="admin-set-title"><strong>${escapeHtml(item.set.title || 'Bez názvu')}</strong><small>${escapeHtml(item.set.description || '')}</small></td>
      <td>${escapeHtml(item.userEmail)}</td>
      <td>${escapeHtml(item.set.className || item.set.subjectCode || 'Bez předmětu')}</td>
      <td>${setItemCountLabel(item.set)}</td>
      <td><button class="btn btn-ghost btn-sm" data-edit-admin-set>Upravit</button></td>
    </tr>`).join('') : '<tr><td colspan="5">Žádné sady neodpovídají filtru.</td></tr>';
    tbody.querySelectorAll('[data-edit-admin-set]').forEach((button,index) => {
      const item = filtered[index];
      button.onclick = () => startAdminSetEdit(item.userId, item.record.payload, item.set, item.userEmail);
    });
  };
  searchInput.oninput = renderRows;
  filterToggle.onclick = () => {
    const isOpen = filterWrap.classList.toggle('open');
    filterToggle.setAttribute('aria-expanded',String(isOpen));
    if(isOpen) searchInput.focus();
  };
  container.querySelector('#clearAdminSetFilters').onclick = () => {
    searchInput.value = '';
    ownerId = '';
    ownerPickerControl.reset();
    searchInput.focus();
  };
  container.querySelector('.admin-set-toolbar').addEventListener('click',event => {
    if(!ownerPicker.contains(event.target)) ownerPickerControl.close();
    if(!filterWrap.contains(event.target)){
      filterWrap.classList.remove('open');
      filterToggle.setAttribute('aria-expanded','false');
    }
  });
  renderRows();
}

function openAdminSetEditor(userId, savedPayload, savedSet, email){
  const payload = savedPayload || { sets:[], classes:[], classIcons:{}, classVisibility:{}, progress:{} };
  openModal(`
    <div class="modal-head"><h2>Upravit sadu</h2><button class="modal-close" data-close>${icon('x',16)}</button></div>
    <p class="page-sub admin-editor-email">${escapeHtml(email)} · ${escapeHtml(savedSet.title || 'Bez názvu')}</p>
    <p class="page-sub">Uprav JSON této sady. Její ID zůstane zachováno.</p>
    <textarea class="field-box admin-json-editor" id="adminSetJsonEditor" spellcheck="false">${escapeHtml(JSON.stringify(savedSet,null,2))}</textarea>
    <div class="class-modal-actions"><button class="btn btn-ghost" data-close>Zrušit</button><button class="btn btn-primary" id="saveAdminSet">Uložit sadu</button></div>
  `, true);
  document.getElementById('saveAdminSet').onclick = async () => {
    let nextSet;
    try{ nextSet = JSON.parse(document.getElementById('adminSetJsonEditor').value); }
    catch{ showToast('JSON není platný. Oprav chybu a zkus to znovu.'); return; }
    if(!nextSet || typeof nextSet !== 'object' || Array.isArray(nextSet) || !Array.isArray(nextSet.cards)){
      showToast('Sada musí být objekt a obsahovat pole cards.');
      return;
    }
    nextSet.id = savedSet.id;
    const setIndex = payload.sets.findIndex(set => set.id === savedSet.id);
    if(setIndex < 0){ showToast('Sada už v tomto účtu neexistuje. Obnov přehled a zkus to znovu.'); return; }
    const nextPayload = { ...payload, sets:[...payload.sets] };
    nextPayload.sets[setIndex] = nextSet;
    let storedPayload;
    try{ storedPayload = await preparePayloadImages(nextPayload,userId); }
    catch(error){ showToast('Uložení obrázků se nezdařilo: ' + (error?.message || 'Zkontroluj nastavení úložiště.')); return; }
    const { error } = await supabaseClient.from('flashcard_data').upsert({ user_id:userId, payload:storedPayload, updated_at:new Date().toISOString() });
    if(error){ showToast('Uložení se nezdařilo: ' + error.message); return; }
    if(currentUser?.id === userId){
      clearTimeout(cloudSaveTimer);
      loadData(storedPayload);
    }
    const storedSet = storedPayload.sets[setIndex];
    const marketplaceRow = {
      owner_id:userId,
      set_id:storedSet.id,
      set_type:getSetType(storedSet),
      title:storedSet.title || 'Bez názvu',
      description:storedSet.description || '',
      subject_code:(storedSet.subjectCode || '').trim().toUpperCase(),
      subject_id:storedSet.className && storedPayload.classVisibility?.[storedSet.className] === true ? storedSet.className : null,
      cards:storedSet.cards,
      sections:storedSet.sections || [],
      is_public:storedSet.isPublic === true,
      updated_at:new Date().toISOString(),
    };
    const { error:marketplaceError } = await supabaseClient.from('marketplace_sets').upsert(marketplaceRow);
    closeModal();
    if(marketplaceError) showToast('Sada byla uložena, ale synchronizace burzy selhala: ' + marketplaceError.message);
    else showToast('Sada byla uložena.');
    const content = document.getElementById('adminContent');
    if(content) await loadAdminSets(content);
  };
}

function openAdminPayloadEditor(userId, savedPayload, email){
  const payload = savedPayload || { sets:[], classes:[], classIcons:{}, progress:{} };
  openModal(`
    <div class="modal-head"><h2>Data účtu</h2><button class="modal-close" data-close>${icon('x',16)}</button></div>
    <p class="page-sub admin-editor-email">${escapeHtml(email)}</p>

    <div class="class-modal-actions"><button class="btn btn-ghost" data-close>Zrušit</button><button class="btn btn-primary" id="saveAdminPayload">Uložit data</button></div>
  `, true);
  document.getElementById('saveAdminPayload').onclick = async () => {
    let nextPayload;
    try{ nextPayload = JSON.parse(document.getElementById('adminJsonEditor').value); }
    catch{ showToast('JSON není platný. Oprav chybu a zkus to znovu.'); return; }
    if(!nextPayload || typeof nextPayload !== 'object' || Array.isArray(nextPayload) || !Array.isArray(nextPayload.sets) || !Array.isArray(nextPayload.classes)){
      showToast('Data musí obsahovat pole sets a classes.');
      return;
    }
    if(!nextPayload.classIcons || typeof nextPayload.classIcons !== 'object') nextPayload.classIcons = {};
    if(!nextPayload.classVisibility || typeof nextPayload.classVisibility !== 'object') nextPayload.classVisibility = {};
    if(!nextPayload.progress || typeof nextPayload.progress !== 'object') nextPayload.progress = {};
    let storedPayload;
    try{ storedPayload = await preparePayloadImages(nextPayload,userId); }
    catch(error){ showToast('Uložení obrázků se nezdařilo: ' + (error?.message || 'Zkontroluj nastavení úložiště.')); return; }
    const { error } = await supabaseClient.from('flashcard_data').upsert({ user_id:userId, payload:storedPayload, updated_at:new Date().toISOString() });
    if(error){ showToast('Uložení se nezdařilo: ' + error.message); return; }
    closeModal();
    showToast('Data účtu byla uložena.');
    const content = document.getElementById('adminContent');
    if(content) await loadAdminContent(content);
  };
}

async function setAdminBan(userId, banned, container){
  const question = banned ? 'Opravdu zablokovat tento účet?' : 'Povolit tomuto účtu znovu přihlášení?';
  if(!await confirmThemed(question,{title:'Potvrdit změnu účtu',confirmLabel:banned?'Zablokovat':'Obnovit',danger:banned})) return;
  const { error } = await supabaseClient.functions.invoke('rapid-task', { body:{ action:'set-ban', userId, banned } });
  if(error){ showToast('Změna účtu se nezdařila: ' + error.message); return; }
  showToast(banned ? 'Účet byl zablokován.' : 'Účet byl obnoven.');
  await loadAdminContent(container);
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function classIcon(name){

function formatDate(timestamp){
  if(!timestamp) return 'neuvedeno';
  return new Intl.DateTimeFormat('cs-CZ', { day:'numeric', month:'numeric', year:'numeric' }).format(new Date(timestamp));
}

function setCountLabel(count){
  return `${count} ${count===1?'sada':count>=2&&count<=4?'sady':'sad'}`;
}

function czechCountNoun(count,singular,few,many){
  if(count === 1) return singular;
  if(count >= 2 && count <= 4) return few;
  return many;
}

function getSetType(set){
  const cards = Array.isArray(set?.cards) ? set.cards : [];
  const hasQuiz = cards.some(card=>card?.kind === 'quiz' || isQuizQuestionCard(card));
  const hasFlashcards = cards.some(card=>card?.kind === 'flashcards'
    || (card?.kind !== 'quiz' && !isQuizQuestionCard(card)));
  if(set?.type === 'mixed' || set?.set_type === 'mixed'
    || (hasQuiz && hasFlashcards)
    || (cards.some(card=>card?.kind === 'quiz') && cards.some(card=>card?.kind === 'flashcards'))) return 'mixed';
  if(set?.type === 'quiz' || set?.set_type === 'quiz' || hasQuiz) return 'quiz';
  return 'flashcards';
}

function isQuizQuestionCard(card){
  return Boolean(card && typeof card === 'object'
    && Object.prototype.hasOwnProperty.call(card,'question')
    && Array.isArray(card.options));
}

function setItemCountLabel(set){
  const count = Array.isArray(set.cards) ? set.cards.length : 0;
  if(getSetType(set) === 'mixed') {
    return `${count} ${czechCountNoun(count,'položka','položky','položek')}`;
  }
  const isQuiz = getSetType(set) === 'quiz';
  const noun = isQuiz
    ? czechCountNoun(count,'otázka','otázky','otázek')
    : czechCountNoun(count,'kartička','kartičky','kartiček');
  return `${count} ${noun}`;
}

function bindFilterPicker(picker, onChange){
  const toggle = picker.querySelector('.setting-picker-current');
  const menu = picker.querySelector('.setting-picker-menu');
  const options = [...menu.querySelectorAll('[data-filter-value]')];
  const setOpen = open => {
    picker.classList.toggle('open',open);
    toggle.setAttribute('aria-expanded',String(open));
  };
  toggle.onclick = () => setOpen(!picker.classList.contains('open'));
  options.forEach(option => option.onclick = () => {
    toggle.querySelector('span').textContent = option.dataset.filterLabel;
    options.forEach(item => {
      const selected = item === option;
      item.classList.toggle('selected',selected);
      item.setAttribute('aria-selected',String(selected));
    });
    setOpen(false);
    onChange(option.dataset.filterValue);
  });
  picker.addEventListener('keydown',event => {
    if(event.key === 'Escape' && picker.classList.contains('open')){
      setOpen(false);
      toggle.focus();
    }
  });
  return {
    close:() => setOpen(false),
    reset:() => {
      const first = options[0];
      if(first) first.click();
    },
  };
}

function sanitizeRichText(value){
  const holder = document.createElement('div');
  holder.innerHTML = value || '';
  const allowed = new Set(['B','STRONG','I','EM','U','BR','UL','OL','LI']);
  const clean = node => Array.from(node.childNodes).forEach(child => {
    if(child.nodeType !== Node.ELEMENT_NODE) return;
    clean(child);
    if(child.tagName === 'DIV' || child.tagName === 'P'){
      if(child.previousSibling && child.previousSibling.nodeName !== 'BR') node.insertBefore(document.createElement('br'), child);
      while(child.firstChild) node.insertBefore(child.firstChild, child);
      child.remove();
    }else if(!allowed.has(child.tagName)){
      while(child.firstChild) node.insertBefore(child.firstChild, child);
      child.remove();
    }else{
      Array.from(child.attributes).forEach(attribute => child.removeAttribute(attribute.name));
    }
  });
  clean(holder);
  return holder.innerHTML;
}

function emptyCard(){ return { term:'', def:'', termImage:null, defImage:null, sectionId:null }; }
function emptyCardWithText(term, def){ return { term, def, termImage:null, defImage:null, sectionId:null }; }

function stripDuplicateFrontFromBack(front, back){
  const frontHtml = String(front || '').trim();
  const backHtml = String(back || '').trimStart();
  if(!frontHtml || !backHtml) return back;
  const separatorPattern = /^(?:\s|<br\s*\/?>|<hr\b[^>]*>|<\/(?:div|p)>)+/i;
  if(backHtml.startsWith(frontHtml)){
    const remainder = backHtml.slice(frontHtml.length);
    if(separatorPattern.test(remainder)) return remainder.replace(separatorPattern,'');
  }
  const frontText = ankiHtmlToText(frontHtml).trim();
  const backText = ankiHtmlToText(backHtml);
  if(!frontText || !backText.startsWith(frontText) || !/^\s/.test(backText.slice(frontText.length))) return back;
  return escapeHtml(backText.slice(frontText.length).trimStart()).replace(/\r?\n/g,'<br>');
}

function normalizeCard(card){
  return {
    ...card,
    def: stripDuplicateFrontFromBack(card.term,card.def),
    termImage: card.termImage || null,
    defImage: card.defImage || card.image || null,
    sectionId: typeof card.sectionId === 'string' ? card.sectionId : null,
  };
}

async function imageFileToDataUrl(file){
  if(typeof createImageBitmap === 'function'){
    let bitmap = null;
    try{ bitmap = await createImageBitmap(file); }catch(e){}
    if(bitmap){
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      if(!context){ bitmap.close(); throw new Error('Prohlížeč nemůže obrázek upravit.'); }
      const maxDimension = 1280;
      let scale = Math.min(1,maxDimension/Math.max(bitmap.width,bitmap.height));
      let optimized = '';
      for(let attempt=0;attempt<7;attempt++){
        canvas.width = Math.max(1,Math.round(bitmap.width*scale));
        canvas.height = Math.max(1,Math.round(bitmap.height*scale));
        context.clearRect(0,0,canvas.width,canvas.height);
        context.drawImage(bitmap,0,0,canvas.width,canvas.height);
        const quality = Math.max(.42,.78-attempt*.07);
        const webp = canvas.toDataURL('image/webp',quality);
        const jpeg = canvas.toDataURL('image/jpeg',quality);
        optimized = webp.length < jpeg.length ? webp : jpeg;
        if(optimized.length <= 360000){
          bitmap.close();
          return optimized;
        }
        scale *= .82;
      }
      bitmap.close();
      if(optimized.length <= 360000) return optimized;
      throw new Error('Obrázek je příliš složitý na uložení. Zkus menší nebo více komprimovaný obrázek.');
    }
  }
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Soubor se nepodařilo přečíst.'));
    reader.readAsDataURL(file);
  });
}

async function compactCardImage(image){
  if(typeof image !== 'string' || !image.startsWith('data:image/') || image.length <= 360000) return image;
  const response = await fetch(image);
  const blob = await response.blob();
  return imageFileToDataUrl(blob);
}

function openCardImagePicker(onSelect){
  openModal(`
    <div class="modal-head"><h2>Vložit obrázek</h2><button class="modal-close" data-close aria-label="Zavřít">${icon('x',16)}</button></div>
    <div class="image-picker-zone" id="cardImagePasteZone" role="button" tabindex="0" aria-label="Vložit obrázek ze schránky nebo přetáhnout soubor">
      ${icon('image',26)}<strong>Vlož obrázek pomocí Ctrl+V</strong><span>Nebo ho sem přetáhni</span>
    </div>
    <input type="file" id="cardImageFile" accept="image/*" hidden>
    <div class="class-modal-actions"><button class="btn btn-ghost" data-close>Zrušit</button><button class="btn btn-primary" id="cardImageBrowse">${icon('image',16)} Nahrát ze zařízení</button></div>
  `);
  const overlay = document.getElementById('modalOverlay');
  const zone = document.getElementById('cardImagePasteZone');
  const input = document.getElementById('cardImageFile');
  const processFile = async file => {
    if(!file) return;
    if(!file.type.startsWith('image/')){ showToast('Vyber prosím obrázkový soubor.'); return; }
    zone.classList.add('processing');
    try{
      const image = await imageFileToDataUrl(file);
      closeModal();
      onSelect(image);
    }catch(error){
      showToast(error.message || 'Obrázek se nepodařilo načíst.');
    }finally{
      zone.classList.remove('processing');
    }
  };
  const handlePaste = event => {
    const items = Array.from(event.clipboardData?.items || []);
    const imageItem = items.find(item => item.type.startsWith('image/'));
    const file = imageItem?.getAsFile() || Array.from(event.clipboardData?.files || []).find(item => item.type.startsWith('image/'));
    if(file){ event.preventDefault(); processFile(file); }
  };
  overlay.addEventListener('paste', handlePaste);
  zone.addEventListener('dragover', event => { event.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', event => {
    event.preventDefault();
    zone.classList.remove('drag-over');
    processFile(Array.from(event.dataTransfer?.files || []).find(file => file.type.startsWith('image/')));
  });
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', event => {
    if(event.key === 'Enter' || event.key === ' '){ event.preventDefault(); input.click(); }
  });
  document.getElementById('cardImageBrowse').onclick = () => input.click();
  input.onchange = () => processFile(input.files[0]);
  zone.focus();
}

function render(){
  const app = document.getElementById('app');
  if(!authReady){
    app.innerHTML = '<main class="auth-screen"><section class="auth-panel"><div class="auth-brand"><span class="logo-dot">🃏</span> Kartičky</div><p>Načítám účet…</p></section></main>';
    return;
  }
  if(!currentUser){ renderAuth(); return; }
  const scrollX = window.scrollX;
  const scrollY = window.scrollY;
  app.innerHTML = '';

  const isStudy = state.view === 'study';
  if(!isStudy){
    app.appendChild(renderMobileNavBar());
    if(mobileNavOpen){
      const scrim = document.createElement('button');
      scrim.className = 'mobile-nav-scrim';
      scrim.type = 'button';
      scrim.setAttribute('aria-label','Zavřít navigaci');
      scrim.onclick = () => { mobileNavOpen = false; render(); };
      app.appendChild(scrim);
    }
    app.appendChild(renderSidebar());
  }

  const main = document.createElement('div');
  main.className = 'main' + (isStudy ? ' study-main' : '');

  if(state.view === 'home') main.appendChild(renderHome());
  else if(state.view === 'library') main.appendChild(renderLibrary());
  else if(state.view === 'marketplace') main.appendChild(renderMarketplace());
  else if(state.view === 'create') main.appendChild(renderCreate());
  else if(state.view === 'study') main.appendChild(renderStudy());
  else if(state.view === 'admin' && isAdmin) main.appendChild(renderAdmin());
  else if(state.view === 'admin-sets' && isAdmin) main.appendChild(renderAdminSets());
  else main.appendChild(renderHome());

  app.appendChild(main);
  window.requestAnimationFrame(() => window.scrollTo(scrollX, scrollY));
  if(!isStudy){
    document.onkeydown = (e) => {
      if(e.code === 'Escape'){ e.preventDefault(); if(mobileNavOpen){ mobileNavOpen=false; render(); } else handleEscape(); }
    };
  }
}

    <p class="page-sub">Změň název, ikonu nebo viditelnost předmětu.</p>
    <input class="field-box" id="editClassName" value="${escapeHtml(oldName)}" autocomplete="off">
    <div class="class-icon-field">
      <div><p class="class-field-label">Ikona předmětu</p>${emojiPickerMarkup(currentIcon, 'editClassEmojiPicker', 'editClassIcon')}</div>
    </div>
    <p class="class-field-label" style="margin-top:16px">Sety v tomto předmětu</p>
    <div class="class-set-combobox" id="classSetCombobox">
      <input class="field-box class-set-search" id="classSetSearch" placeholder="Vyhledat sadu podle názvu..." autocomplete="off">
      <button type="button" class="class-set-toggle" id="classSetToggle" aria-label="Rozbalit seznam sad" aria-expanded="false" aria-controls="classSetPicker"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="class-set-list" id="classSetPicker">
        ${sortedSets.length ? sortedSets.map(set => `<label class="class-set-option"><input type="checkbox" data-class-set="${escapeHtml(set.id)}" ${set.className===oldName?'checked':''}><span>${escapeHtml(set.title || 'Bez názvu')}</span></label>`).join('') : '<span class="class-icon-hint">Zatím nemáš žádné sady.</span>'}
      </div>
    </div>
    <div class="class-modal-actions">
      <button type="button" class="pill-toggle" id="editSubjectVisibility"></button>
      <button class="btn btn-ghost" data-close>Zrušit</button>
      <button class="btn btn-primary" id="saveClassEdit">Uložit změny</button>
    </div>
  `);
  document.querySelector('#modalOverlay .modal').classList.add('class-modal');
  bindEmojiPicker('editClassEmojiPicker', 'editClassIcon');
  const nameInput = document.getElementById('editClassName');
  const iconInput = document.getElementById('editClassIcon');
  const visibilityToggle = document.getElementById('editSubjectVisibility');
  const updateVisibilityLabel = () => { visibilityToggle.textContent = isPublic ? '🌐 Veřejný předmět' : '🔒 Soukromý předmět'; };
  updateVisibilityLabel();
  visibilityToggle.onclick = () => { isPublic = !isPublic; updateVisibilityLabel(); };
  const setSearch = document.getElementById('classSetSearch');
  const setPicker = document.getElementById('classSetPicker');
  const setCombobox = document.getElementById('classSetCombobox');
  const setToggle = document.getElementById('classSetToggle');
  const toggleSetPicker = (open) => {
    setPicker.classList.toggle('open', open);
    setCombobox.classList.toggle('open', open);
    setToggle.setAttribute('aria-expanded',String(open));
  };
  setSearch.onfocus = () => toggleSetPicker(true);
  setToggle.onclick = (e) => { e.stopPropagation(); toggleSetPicker(!setPicker.classList.contains('open')); };
  setSearch.oninput = () => {
    toggleSetPicker(true);
    const query = setSearch.value.trim().toLocaleLowerCase();
    document.querySelectorAll('.class-set-option').forEach(option => {
      option.style.display = option.textContent.toLocaleLowerCase().includes(query) ? 'flex' : 'none';
    });
  };
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if(!setCombobox.contains(e.target)) toggleSetPicker(false);
  });
  const save = () => {
    const newName = nameInput.value.trim();
    if(!newName){ nameInput.focus(); return; }
    if(newName !== oldName && state.classes.includes(newName)){ showToast('Předmět s tímto názvem už existuje.'); return; }
    const index = state.classes.indexOf(oldName);
    state.classes[index] = newName;
    state.classIcons[newName] = iconInput.value.trim() || '📚';
    state.classVisibility[newName] = isPublic;
    if(newName !== oldName) delete state.classIcons[oldName];
    if(newName !== oldName) delete state.classVisibility[oldName];
    document.querySelectorAll('[data-class-set]').forEach(input => {
      const set = state.sets.find(item => item.id === input.dataset.classSet);
      if(set && input.checked) set.className = newName;
      else if(set && set.className === oldName) set.className = '';
    });
    if(state.activeClassFilter === oldName) state.activeClassFilter = newName;
    if(state.librarySubjectFilter === oldName || state.librarySubjectFilter === newName) state.librarySubjectFilter = '';
    saveClasses(); saveClassIcons(); saveSets();
    closeModal();
    render();
  };
  document.getElementById('saveClassEdit').onclick = save;
  nameInput.onkeydown = (e) => { if(e.key === 'Enter') save(); };
  nameInput.focus();
}

function openAssignClassModal(setId){
  const set = state.sets.find(item => item.id === setId);
  if(!set) return;
  if(state.classes.length === 0){ showToast('Nejdřív vytvoř alespoň jeden předmět.'); return; }
  let selectedClass = set.className || '';
  openModal(`
    <div class="modal-head"><h2>Přiřadit do předmětu</h2><button class="modal-close" data-close>${icon('x',16)}</button></div>
    <p class="page-sub">Vyber předmět pro set „${escapeHtml(set.title)}“.</p>
    <div class="setting-picker" id="assignClassPicker">
      <button type="button" class="setting-picker-current" id="assignClassToggle" aria-expanded="false"><span>${selectedClass ? `${escapeHtml(state.classIcons[selectedClass] || '📚')} ${escapeHtml(selectedClass)}` : 'Bez předmětu'}</span><span aria-hidden="true"></span></button>
      <div class="setting-picker-menu">
        <button type="button" class="setting-picker-option ${selectedClass===''?'selected':''}" data-assignment-class="">Bez předmětu</button>
        ${state.classes.map(name => `<button type="button" class="setting-picker-option ${selectedClass===name?'selected':''}" data-assignment-class="${escapeHtml(name)}">${classIcon(name)} ${escapeHtml(name)}</button>`).join('')}
      </div>
    </div>
    <div class="class-modal-actions">
      <button class="btn btn-ghost" data-close>Zrušit</button>
      <button class="btn btn-primary" id="saveClassAssignment">Uložit</button>
    </div>
  `);
  const assignClassPicker = document.getElementById('assignClassPicker');
  const assignClassToggle = document.getElementById('assignClassToggle');
  assignClassToggle.onclick = () => {
    const isOpen = assignClassPicker.classList.toggle('open');
    assignClassToggle.setAttribute('aria-expanded',String(isOpen));
  };
  document.querySelectorAll('[data-assignment-class]').forEach(button => button.onclick = () => {
    selectedClass = button.dataset.assignmentClass;
    document.querySelectorAll('[data-assignment-class]').forEach(option => option.classList.toggle('selected', option === button));
    assignClassPicker.querySelector('#assignClassToggle span').textContent = selectedClass ? `${state.classIcons[selectedClass] || '📚'} ${selectedClass}` : 'Bez předmětu';
    assignClassPicker.classList.remove('open');
    assignClassToggle.setAttribute('aria-expanded','false');
  });
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if(!assignClassPicker.contains(e.target)){
      assignClassPicker.classList.remove('open');
      assignClassToggle.setAttribute('aria-expanded','false');
    }
  });
  document.getElementById('saveClassAssignment').onclick = () => {
    set.className = selectedClass;
    saveSets();
    closeModal();
    render();
    showToast('Set byl přiřazen do předmětu.');
  };
}

/* ============================= HOME ============================= */
function renderHome(){
  const wrap = document.createElement('div');
  const recent = [...state.sets].sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  const continueSets = Object.entries(state.progress)
    .map(([setId, progress]) => ({ set:state.sets.find(item => item.id === setId), progress }))
    .filter(item => item.set)
    .sort((a,b) => b.progress.updatedAt - a.progress.updatedAt);
  const recentClassNames = state.classes
    .map(name => ({ name, latest: Math.max(0, ...state.sets.filter(set => set.className === name).map(set => set.updatedAt || set.createdAt || 0)) }))
    .sort((a,b) => b.latest - a.latest)
    .slice(0,3)
    .map(item => item.name);
  const activeClassSets = state.activeClassFilter ? recent.filter(set => set.className === state.activeClassFilter) : [];
  wrap.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">${state.activeClassFilter ? `${classIcon(state.activeClassFilter)} ${escapeHtml(state.activeClassFilter)}` : 'Vítej zpátky 👋'}</h1>
        <p class="page-sub">${state.activeClassFilter ? 'Sety kartiček v tomto předmětu.' : 'Pokračuj v učení nebo si vytvoř novou sadu kartiček.'}</p>
      </div>
      <div class="home-header-actions">${state.activeClassFilter?'<button class="home-more" id="clearClassFilter">Zrušit výběr</button>':''}<button class="btn btn-primary" id="createBtn">${icon('plus',18)} ${state.activeClassFilter?'Vytvořit set':'Vytvořit sadu'}</button></div>
    </div>
    ${state.activeClassFilter ? `<section class="home-section active-class-section"><div class="set-grid home-set-grid ${state.libraryView==='list'?'list-view':''} ${state.libraryView==='grid'&&activeClassSets.length===1?'single-set':''}" id="activeClassGrid"></div></section>` : (recent.length || recentClassNames.length ? `
      ${continueSets.length ? `<section class="home-section"><div class="home-section-head"><h3 class="home-section-title">Pokračovat ve studování</h3>${continueSets.length>6?'<button class="home-more" id="continueMore">Zobrazit vše</button>':''}</div><div class="set-grid home-set-grid ${state.libraryView==='list'?'list-view':''} ${state.libraryView==='grid'&&continueSets.length===1?'single-set':''}" id="continueGrid"></div></section>` : ''}
      <section class="home-section"><div class="home-section-head"><h3 class="home-section-title">Nedávné předměty</h3></div><div class="home-class-grid ${state.libraryView==='list'?'list-view':''}" id="recentClasses"></div></section>
      ${recent.length ? `<section class="home-section"><div class="home-section-head"><h3 class="home-section-title">Nedávné sady</h3></div><div class="set-grid home-set-grid ${state.libraryView==='list'?'list-view':''} ${state.libraryView==='grid'&&recent.length===1?'single-set':''}" id="recentGrid"></div></section>` : ''}` :
      `<div class="empty-state">
        <div style="font-size:34px">📚</div>
        <h3>Zatím žádné kartičky</h3>
        <p>Vytvoř první sadu a začni se učit.</p>
        <button class="btn btn-primary" id="emptyCreateBtn">${icon('plus',18)} Vytvořit sadu</button>
      </div>`)}
  `;
  wrap.querySelector('#createBtn').onclick = startCreate;
  const clearClassFilter = wrap.querySelector('#clearClassFilter');
  if(clearClassFilter) clearClassFilter.onclick = () => { state.activeClassFilter = null; render(); };
  const activeClassGrid = wrap.querySelector('#activeClassGrid');
  if(activeClassGrid){
    if(activeClassSets.length) activeClassSets.forEach(set => activeClassGrid.appendChild(renderSetCard(set)));
    else activeClassGrid.innerHTML = `<div class="empty-state"><h3>Tento předmět je prázdný</h3><p>Vytvoř nový set, nebo přidej existující set do předmětu.</p><div class="subject-empty-actions"><button class="btn btn-primary" id="createSubjectSet">${icon('plus',18)} Vytvořit set</button><button class="btn btn-ghost" id="addExistingSubjectSet">${icon('folder',17)} Přidat existující</button></div></div>`;
    const createSubjectSet = activeClassGrid.querySelector('#createSubjectSet');
    if(createSubjectSet) createSubjectSet.onclick = () => startCreate(state.activeClassFilter);
    const addExistingSubjectSet = activeClassGrid.querySelector('#addExistingSubjectSet');
    if(addExistingSubjectSet) addExistingSubjectSet.onclick = () => openEditClassModal(state.activeClassFilter);
  }
  const emptyBtn = wrap.querySelector('#emptyCreateBtn');
  if(emptyBtn) emptyBtn.onclick = startCreate;
  const continueGrid = wrap.querySelector('#continueGrid');
  if(continueGrid) continueSets.forEach(item => continueGrid.appendChild(renderSetCard(item.set)));
  const continueMore = wrap.querySelector('#continueMore');
  if(continueMore) continueMore.onclick = () => {
    continueGrid.classList.toggle('expanded');
    continueMore.textContent = continueGrid.classList.contains('expanded') ? 'Skrýt' : 'Zobrazit vše';
  };
  const classesGrid = wrap.querySelector('#recentClasses');
  if(classesGrid) recentClassNames.forEach(name => {
    const classButton = document.createElement('button');
    classButton.className = 'home-class-card';
    const count = state.sets.filter(set => set.className === name).length;
    classButton.innerHTML = `${classIcon(name)}<span><strong>${escapeHtml(name)}</strong><small>${setCountLabel(count)}</small></span>`;
    classButton.onclick = () => { state.activeClassFilter = name; state.view = 'home'; render(); };
    classesGrid.appendChild(classButton);
  });
  const grid = wrap.querySelector('#recentGrid');
  if(grid) recent.slice(0,3).forEach(s => grid.appendChild(renderSetCard(s)));

/* ============================= LIBRARY ============================= */
function renderLibrary(){
  const wrap = document.createElement('div');
  const sortSets = sets => [...sets].sort((a,b) => state.librarySort === 'title'
    ? (a.title||'').localeCompare(b.title||'', 'cs', { sensitivity:'base' })
    : state.librarySort === 'created'
      ? (b.createdAt||b.updatedAt||0) - (a.createdAt||a.updatedAt||0)
      : (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0));
  const getFilteredSets = () => {
    const query = state.librarySearch.trim().toLocaleLowerCase('cs');
    const base = state.activeClassFilter ? state.sets.filter(set => set.className === state.activeClassFilter) : state.sets;
    return sortSets(base.filter(set => {
      if(state.librarySubjectFilter && set.className !== state.librarySubjectFilter) return false;
      const searchable = [set.title,set.description,set.className,set.subjectCode].join(' ').toLocaleLowerCase('cs');
      return !query || searchable.includes(query);
    }));
  };
  const sorted = getFilteredSets();
  const hasActiveFilters = () => Boolean(state.librarySearch.trim() || state.librarySubjectFilter || state.activeClassFilter);
  wrap.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">${state.activeClassFilter ? escapeHtml(state.activeClassFilter) : 'Vaše knihovna'}</h1>
        <p class="page-sub" id="libraryCount">${setCountLabel(sorted.length)}</p>
      </div>
      <div class="library-toolbar">
        <div class="library-filter-wrap" id="libraryFilterWrap">
          <button type="button" class="library-filter-button" id="libraryFilterToggle" aria-label="Otevřít filtry knihovny" title="Filtry" aria-expanded="false" aria-pressed="${hasActiveFilters()}">${icon('filter',18)}</button>
          <div class="library-filter-popover" id="libraryFilterPopover">
            <label class="library-filter-field">Hledat<input class="field-box" id="librarySearch" type="search" placeholder="Název, popis nebo kód" value="${escapeHtml(state.librarySearch)}"></label>
            <label class="library-filter-field">Předmět${filterPickerMarkup('librarySubjectPicker','Předmět',[{value:'',label:'Všechny předměty'},...state.classes.map(name=>({value:name,label:`${state.classIcons[name]||'📚'} ${name}`}))],state.librarySubjectFilter,'Filtrovat podle předmětu')}</label>
            <label class="library-filter-field">Řazení${filterPickerMarkup('librarySortPicker','Řazení',[{value:'updated',label:'Nedávné'},{value:'title',label:'Abecedně'},{value:'created',label:'Datum vytvoření'}],state.librarySort,'Řadit sady')}</label>
            <div class="library-filter-footer"><span class="admin-set-count" id="libraryFilterCount">${setCountLabel(sorted.length)}</span><button type="button" class="btn btn-outline btn-sm" id="clearLibraryFilters">Vymazat filtry</button></div>
          </div>
        </div>
        <button class="btn btn-primary" id="createBtn">${icon('plus',18)} Vytvořit</button>
      </div>
    </div>
    <div class="set-grid library-grid ${state.libraryView==='list'?'list-view':''} ${state.libraryView==='grid'&&sorted.length===1?'single-set':''}" id="grid"></div>
  `;
  wrap.querySelector('#createBtn').onclick = startCreate;
  const grid = wrap.querySelector('#grid');
  const filterWrap = wrap.querySelector('#libraryFilterWrap');
  const filterToggle = wrap.querySelector('#libraryFilterToggle');
  const searchInput = wrap.querySelector('#librarySearch');
  const subjectPicker = wrap.querySelector('#librarySubjectPicker');
  const sortPicker = wrap.querySelector('#librarySortPicker');
  let subjectPickerControl;
  let sortPickerControl;
  const filterPopover = wrap.querySelector('#libraryFilterPopover');
  const positionFilterPopover = () => {
    const anchor = filterToggle.getBoundingClientRect();
    const popoverWidth = Math.min(340,window.innerWidth-24);
    filterPopover.style.width = `${popoverWidth}px`;
    filterPopover.style.left = `${Math.max(12,Math.min(anchor.right-popoverWidth,window.innerWidth-popoverWidth-12))}px`;
    filterPopover.style.top = '12px';
    const popoverHeight = Math.min(filterPopover.scrollHeight,window.innerHeight-24);
    const roomBelow = window.innerHeight-anchor.bottom-20;
    filterPopover.style.top = `${roomBelow>=popoverHeight ? anchor.bottom+8 : Math.max(12,anchor.top-popoverHeight-8)}px`;
  };
  const renderRows = () => {
    state.librarySearch = searchInput.value;
    const results = getFilteredSets();
    const countText = setCountLabel(results.length);
    wrap.querySelector('#libraryCount').textContent = countText;
    wrap.querySelector('#libraryFilterCount').textContent = countText;
    filterToggle.setAttribute('aria-pressed',String(hasActiveFilters()));
    grid.className = `set-grid library-grid ${state.libraryView==='list'?'list-view':''} ${state.libraryView==='grid'&&results.length===1?'single-set':''}`;
    if(results.length === 0){
      const noSets = state.sets.length === 0;
      grid.innerHTML = `<div class="empty-state"><div style="font-size:34px">🗂️</div><h3>${noSets?'Nic tu není':'Nic neodpovídá filtrům'}</h3><p>${noSets?'Vytvoř svou první sadu kartiček.':'Zkus změnit hledání nebo vybraný předmět.'}</p>${noSets?`<button class="btn btn-primary" id="emptyCreateBtn2">${icon('plus',18)} Vytvořit sadu</button>`:''}</div>`;
      const emptyCreate = grid.querySelector('#emptyCreateBtn2');
      if(emptyCreate) emptyCreate.onclick = startCreate;
    }else{
      grid.replaceChildren(...results.map(set=>renderSetCard(set)));
    }
  };
  subjectPickerControl = bindFilterPicker(subjectPicker,value => {
    state.librarySubjectFilter = value;
    renderRows();
  });
  sortPickerControl = bindFilterPicker(sortPicker,value => {
    state.librarySort = value;
    renderRows();
  });
  filterToggle.onclick = () => {
    const isOpen = filterWrap.classList.toggle('open');
    filterToggle.setAttribute('aria-expanded',String(isOpen));
    if(isOpen){
      positionFilterPopover();
      searchInput.focus({ preventScroll:true });
    }
  };
  searchInput.oninput = renderRows;
  wrap.querySelector('#clearLibraryFilters').onclick = () => {
    state.librarySearch = '';
    state.librarySubjectFilter = '';
    state.activeClassFilter = null;
    searchInput.value = '';
    subjectPickerControl.reset();
    sortPickerControl.close();
    searchInput.focus();
  };
  wrap.addEventListener('click',event=>{
    if(!subjectPicker.contains(event.target)) subjectPickerControl.close();
    if(!sortPicker.contains(event.target)) sortPickerControl.close();
    if(!filterWrap.contains(event.target)){ filterWrap.classList.remove('open'); filterToggle.setAttribute('aria-expanded','false'); }
  });
  renderRows();
  return wrap;
}

      sections:Array.isArray(source.sections) ? JSON.parse(JSON.stringify(source.sections)) : [],
      createdAt:Date.now(), updatedAt:Date.now(),
    });

    showToast('Set kartiček byl přidán do knihovny.');
    if(button){ button.disabled=true; button.textContent='Přidáno'; }
  };

    const cards = Array.isArray(source.cards) ? source.cards : [];

    let cardIndex = 0;

      <p class="page-sub">Náhled veřejného setu${source.subject_code?` · ${escapeHtml(source.subject_code)}`:''}</p>

        <div class="market-preview-controls">

        </div>
      </div>
      <div class="market-preview-actions"><button type="button" class="btn btn-primary" id="marketPreviewAdd">${icon('plus',16)} Přidat do knihovny</button></div>
    `, true);
    const previewCard = document.getElementById('marketPreviewCard');
    const counter = document.getElementById('marketPreviewCounter');
    const paintCard = () => {
      const card = cards[cardIndex];

function emptyQuizQuestion(){
  return { question:'', questionImage:null, explanation:'', sectionId:null, options:[{ text:'', correct:true },{ text:'', correct:false }] };
