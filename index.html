function isQuizCard(card,set){
  const setType = getSetType(set);
  return setType === 'quiz' || card?.kind === 'quiz' || isQuizQuestionCard(card);
}

function toFlashcard(card){
  return {
    ...emptyCardWithText(card.question || '',card.options?.find(option=>option.correct)?.text || ''),
    termImage:card.questionImage || null,
    sectionId:card.sectionId || null,
  };
}

function toQuizCard(card){
  return {
    ...emptyQuizQuestion(),
    question:card.term || '',
    questionImage:card.termImage || card.image || null,
    sectionId:card.sectionId || null,
    options:[{ text:card.def || '', correct:true },{ text:'', correct:false }],
  };
}

function convertAnkiQuestionFlashcard(card){
  if(card?.kind !== 'flashcards') return null;
  const questionText = ankiHtmlToText(card.term).trim();
  const answerText = ankiHtmlToText(card.def).trim();
  if(!questionText
    || !answerText.toLocaleLowerCase('cs').startsWith(questionText.toLocaleLowerCase('cs'))) return null;
  const answerRemainder = answerText.slice(questionText.length);
  if(!/^\s*\r?\n/.test(answerRemainder)) return null;
  const correctAnswer = answerRemainder.replace(/^\s*\r?\n\s*/,'').trim();
  if(!correctAnswer) return null;
  return {
    ...emptyQuizQuestion(),
    kind:'quiz',
    question:card.term,
    questionImage:card.termImage || card.image || null,
    sectionId:card.sectionId || null,
    options:[
      { text:correctAnswer, image:card.defImage || card.image || null, correct:true },
      { text:'Nevím', image:null, correct:false },
    ],
  };
}

function normalizeSections(sections){
  if(!Array.isArray(sections)) return [];
  const ids = new Set();
  const valid = sections.filter(section => {
    if(!section || typeof section.id !== 'string' || !section.id || ids.has(section.id)
      || typeof section.name !== 'string' || !section.name.trim()) return false;
    ids.add(section.id);
    return true;
  })
    .map(section => ({ id:section.id, name:section.name.trim(), parentId:typeof section.parentId === 'string' ? section.parentId : null }));
  const knownIds = new Set(valid.map(section=>section.id));
  const byId = new Map(valid.map(section=>[section.id,section]));
  return valid.map(section => {
    let parentId = section.parentId !== section.id && knownIds.has(section.parentId) ? section.parentId : null;
    const visited = new Set([section.id]);
    let currentId = parentId;
    while(currentId){
      if(visited.has(currentId)){ parentId = null; break; }
      visited.add(currentId);
      currentId = byId.get(currentId)?.parentId || null;
    }
    return { ...section, parentId };
  });
}

function studyCountLabel(count,isQuiz){
  const forms = isQuiz === 'mixed' ? ['položka','položky','položek'] : isQuiz ? ['otázka','otázky','otázek'] : ['kartička','kartičky','kartiček'];
  const form = czechCountNoun(count,...forms);
  return `${count} ${form}`;
}

function sectionPathLabel(sections, sectionId){
  const byId = new Map(sections.map(section => [section.id,section]));
  const names = [];
  const visited = new Set();
  let current = byId.get(sectionId);
  while(current && !visited.has(current.id)){
    visited.add(current.id);
    names.unshift(current.name);
    current = byId.get(current.parentId);
  }
  return names.join(' / ');
}

function sectionDescendantIds(sections, sectionId){
  const descendants = [];
  const queue = [sectionId];
  while(queue.length){
    const currentId = queue.shift();
    if(descendants.includes(currentId)) continue;
    descendants.push(currentId);
    sections.filter(section => section.parentId === currentId).forEach(section => queue.push(section.id));
  }
  return descendants;
}

    const selected = candidates.find(option=>option.id===selectedParentId);
    selectedLabel.textContent = `Nadřazený blok: ${selected?.name || 'Hlavní blok'}`;
    options.innerHTML = candidates.map(option=>`
      <button type="button" class="section-parent-option ${option.id===selectedParentId?'selected':''}" role="radio" aria-checked="${option.id===selectedParentId}" style="padding-left:${11+Math.max(0,option.depth-1)*16}px" data-parent-section="${escapeHtml(option.id || '')}">
        <span class="section-parent-radio" aria-hidden="true"></span><span class="section-parent-label">${escapeHtml(option.name)}</span>
      </button>`).join('');
    options.querySelectorAll('[data-parent-section]').forEach(button=>button.onclick=()=>{
      selectedParentId = button.dataset.parentSection || null;
      renderOptions();
    });
  };
  renderOptions();
  const save = () => {
    const name = input.value.trim();
    if(!name){ showToast('Zadej název bloku.'); input.focus(); return; }
    const section = { id:uid(), name, parentId:selectedParentId };
    closeModal();
    onCreate(section);
  };

  input.addEventListener('keydown',event=>{ if(event.key==='Enter'){ event.preventDefault(); save(); } });
  input.focus();
}

  wrap.appendChild(toolbar);

  const editorLayout = document.createElement('div');
  editorLayout.className = 'editor-layout';
  const editorColumn = document.createElement('div');

  const cardsContainer = document.createElement('div');

  cardsContainer.className = 'editor-section-list';
  editorColumn.appendChild(cardsContainer);
  const expandedEditorSections = new Set([...draft.sections.map(section=>section.id),...(!draft.sections.length?['__unassigned__']:[])]);
  const editorSectionPanel = document.createElement('details');

  editorSectionPanel.innerHTML = `<summary>Bloky a podbloky</summary><div class="section-panel-content"></div>`;
  const sectionPanelContent = editorSectionPanel.querySelector('.section-panel-content');
  const renderEditorSectionPanel = () => {
    sectionPanelContent.innerHTML = `
      ${draft.sections.length ? '' : '<p class="section-panel-empty">Přidej blok, například přednášku. Podbloky můžeš přidat přímo pod něj.</p>'}
      <div class="section-tree"></div>

    `;
    const tree = sectionPanelContent.querySelector('.section-tree');
    const deleteSectionSubtree = async section => {
      const sectionIds = sectionDescendantIds(draft.sections,section.id);
      const cardCount = draft.cards.filter(card=>sectionIds.includes(card.sectionId)).length;
      const descendantCount = sectionIds.length - 1;
      const subtreeDescription = descendantCount ? ` a ${descendantCount} podbloků` : '';
      const cardLabel = studyCountLabel(cardCount,draft.type==='mixed'?'mixed':draft.type==='quiz');
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay confirm-overlay';
      overlay.innerHTML = `
        <section class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="sectionDeleteTitle" aria-describedby="sectionDeleteMessage">
          <div class="modal-head"><h2 id="sectionDeleteTitle">Smazat blok?</h2><button type="button" class="modal-close" data-delete-close aria-label="Zavřít">${icon('x',16)}</button></div>
          <p class="confirm-message" id="sectionDeleteMessage">Blok „${escapeHtml(sectionPathLabel(draft.sections,section.id))}“${subtreeDescription} obsahuje ${cardLabel}.</p>
          <div class="section-delete-actions">
            <div class="section-delete-choice-row">
              <button type="button" class="btn btn-danger" data-delete-choice="with-cards">Smazat blok i kartičky</button>
              <button type="button" class="btn btn-primary" data-delete-choice="without-cards">Smazat blok bez kartiček</button>
            </div>
            <div class="section-delete-cancel-row"><button type="button" class="btn btn-ghost" data-delete-choice="cancel">Zrušit</button></div>
          </div>
        </section>`;
      const choice = await new Promise(resolve => {
        let settled = false;
        const finish = value => {
          if(settled) return;
          settled = true;
          overlay.remove();
          resolve(value);
        };
        overlay.addEventListener('click',event=>{ if(event.target===overlay) finish('cancel'); });
        overlay.addEventListener('keydown',event=>{
          if(event.key==='Escape'){ event.preventDefault(); finish('cancel'); }
        });
        overlay.querySelector('[data-delete-close]').onclick = () => finish('cancel');
        overlay.querySelectorAll('[data-delete-choice]').forEach(button=>{
          button.onclick = () => finish(button.dataset.deleteChoice);
        });
        document.body.appendChild(overlay);
        overlay.querySelector('[data-delete-choice="cancel"]').focus();
      });
      if(choice === 'cancel') return;
      if(choice === 'with-cards'){
        draft.cards = draft.cards.filter(card=>!sectionIds.includes(card.sectionId));
      }else{
        draft.cards.forEach(card=>{ if(sectionIds.includes(card.sectionId)) card.sectionId = null; });
      }
      draft.sections = draft.sections.filter(item=>!sectionIds.includes(item.id));
      sectionIds.forEach(id=>expandedEditorSections.delete(id));
      rebuildRows();
    };
    const renderNode = (section, depth=0) => {
      const children = draft.sections.filter(item => item.parentId === section.id);
      const directCount = draft.cards.filter(card => card.sectionId === section.id).length;
      const node = document.createElement(children.length ? 'details' : 'div');
      node.className = 'section-tree-node';
      if(children.length){

        node.addEventListener('toggle',()=>node.open ? expandedEditorSections.add(section.id) : expandedEditorSections.delete(section.id));
      }else{
        node.classList.add('section-tree-leaf');
        node.innerHTML = `<div class="section-tree-row"><span class="section-tree-label">${escapeHtml(section.name)}</span><span class="section-tree-count">${directCount}</span><span class="section-tree-actions"><button type="button" data-add-child title="Přidat podblok" aria-label="Přidat podblok">＋</button><button type="button" data-delete-section title="Smazat blok" aria-label="Smazat blok ${escapeHtml(section.name)}">${icon('trash',14)}</button></span></div>`;

        event.preventDefault();
        event.stopPropagation();
        openSectionModal(draft.sections,section.id,newSection=>{ draft.sections.push(newSection); expandedEditorSections.add(section.id); expandedEditorSections.add(newSection.id); renderEditorSectionPanel(); rebuildRows(); });
      };
      node.querySelector('[data-delete-section]').onclick = async event => {
        event.preventDefault();
        event.stopPropagation();
        await deleteSectionSubtree(section);
      };
      const childWrap = node.querySelector('.section-tree-children');
      children.forEach(child => childWrap.appendChild(renderNode(child,depth+1)));
      return node;
    };
    const roots = draft.sections.filter(section => !draft.sections.some(parent => parent.id === section.parentId));

      rebuildRows();
    });

    }else{
      row.querySelector('.term-input').oninput = (e) => { cardData.term = sanitizeRichText(e.target.innerHTML); };
      row.querySelector('.def-input').oninput = (e) => { cardData.def = sanitizeRichText(e.target.innerHTML); };
    }
    row.querySelectorAll('.format-btn').forEach(button => {
      let savedRange = null;
      button.onmousedown = e => {
        e.preventDefault();
        const selection = window.getSelection();
        savedRange = selection?.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
      };
      button.onclick = () => {
        const editor = button.closest('.card-field').querySelector('.rich-editor');
        editor.focus();
        if(savedRange){
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(savedRange);
        }
        document.execCommand(button.dataset.command, false);
        savedRange = null;
        editor.dispatchEvent(new Event('input', { bubbles:true }));
      };
    });
    row.querySelector('.del-row').onclick = () => {
      if(draft.cards.length <= 1){ showToast('Sada musí mít alespoň jednu kartičku.'); return; }
      const idx = draft.cards.indexOf(cardData);
      draft.cards.splice(idx,1);
      rebuildRows();
    };
    const dragHandle = row.querySelector('.drag-h');
    dragHandle.draggable = true;
    dragHandle.addEventListener('dragstart', (e) => {
      e.stopPropagation();
      draggedCard = cardData;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', cardData.term || 'card');
      requestAnimationFrame(() => row.classList.add('dragging'));
    });
    row.addEventListener('dragstart', (e) => {
      if(e.target.closest('.drag-h')) return;
      e.preventDefault();
    });
    row.addEventListener('dragover', (e) => {
      if(!draggedCard || draggedCard === cardData) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      row.classList.remove('drag-over');
      if(!draggedCard || draggedCard === cardData) return;
      const fromIndex = draft.cards.indexOf(draggedCard);
      let toIndex = draft.cards.indexOf(cardData);
      draft.cards.splice(fromIndex, 1);
      if(fromIndex < toIndex) toIndex -= 1;
      draggedCard.sectionId = cardData.sectionId || null;
      draft.cards.splice(toIndex, 0, draggedCard);
      draggedCard = null;
      rebuildRows();
    });
    row.addEventListener('dragend', () => {
      draggedCard = null;
      cardsContainer.querySelectorAll('.card-row').forEach(cardRow => cardRow.classList.remove('dragging', 'drag-over'));
    });
    if(!quizCard) [['.term-image', 'termImage'], ['.def-image', 'defImage']].forEach(([dropSelector, property]) => {
      const dropLabel = row.querySelector(dropSelector);
      dropLabel.addEventListener('click', (e) => {
        if(e.target.closest('.remove-img')){
          e.preventDefault();
          e.stopPropagation();
          cardData[property] = null;
          rebuildRows();
          return;
        }
        openCardImagePicker(image => {
          cardData[property] = image;
          rebuildRows();
          showToast('Obrázek je přiložený; uloží se společně se setem.');
        });
      });
      dropLabel.addEventListener('keydown', event => {
        if(event.target.closest('.remove-img') || !event.target.closest('.image-drop')) return;
        if(event.key === 'Enter' || event.key === ' '){ event.preventDefault(); openCardImagePicker(image => { cardData[property] = image; rebuildRows(); }); }
      });
    });
    else{
      const dropLabel = row.querySelector('.quiz-question-image');
      dropLabel.addEventListener('click', event => {
        if(event.target.closest('.remove-img')){
          event.preventDefault();
          event.stopPropagation();
          cardData.questionImage = null;
          rebuildRows();
          return;
        }
        openCardImagePicker(image => { cardData.questionImage = image; rebuildRows(); });
      });
      dropLabel.addEventListener('keydown', event => {
        if(!event.target.closest('.image-drop')) return;
        if(event.key === 'Enter' || event.key === ' '){ event.preventDefault(); openCardImagePicker(image => { cardData.questionImage = image; rebuildRows(); }); }
      });
    }
    return row;
  }

  function createAddCardButton(sectionId=null){
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn btn-outline btn-sm editor-section-add';
    button.title = sectionId ? `Přidat do „${sectionPathLabel(draft.sections,sectionId)}“` : 'Přidat bez bloku';
    const addCard = kind => {
      const card = kind==='quiz' ? emptyQuizQuestion() : emptyCard();
      card.sectionId = sectionId;
      if(draft.type==='mixed') card.kind = kind;
      draft.cards.push(card);
      rebuildRows();
    };
    if(draft.type==='mixed'){
      button.innerHTML = `${icon('plus',14)} Přidat kartičku`;
      button.onclick = () => addCard('flashcards');
      return button;
    }
    button.innerHTML = `${icon('plus',14)} ${draft.type==='quiz'?'Přidat otázku':'Přidat kartičku'}`;
    button.onclick = () => addCard(draft.type==='quiz'?'quiz':'flashcards');
    return button;
  }

  function renderEditorCardGroups(){
    cardsContainer.innerHTML = '';
    const renderGroup = (section,depth=0) => {
      const group = document.createElement('details');
      group.className = 'editor-section-group';
      group.dataset.depth = String(depth);
      group.open = expandedEditorSections.has(section.id);
      group.innerHTML = `<summary><span class="editor-section-name">${escapeHtml(section.name)}</span><span class="editor-section-count"></span></summary><div class="editor-section-content"></div>`;
      group.addEventListener('toggle',()=>group.open ? expandedEditorSections.add(section.id) : expandedEditorSections.delete(section.id));
      const content = group.querySelector('.editor-section-content');
      const directCards = draft.cards.filter(card=>card.sectionId===section.id);
      group.querySelector('.editor-section-count').textContent = studyCountLabel(directCards.length,draft.type==='mixed'?'mixed':draft.type==='quiz');
      directCards.forEach(card=>content.appendChild(buildRow(card,draft.cards.indexOf(card))));
      content.appendChild(createAddCardButton(section.id));
      const children = draft.sections.filter(child=>child.parentId===section.id);
      if(children.length){
        const childWrap = document.createElement('div');
        childWrap.className = 'editor-section-children';
        children.forEach(child=>childWrap.appendChild(renderGroup(child,depth+1)));
        content.appendChild(childWrap);
      }
      content.addEventListener('dragover',event=>{
        if(!draggedCard || event.target.closest('.card-row')) return;
        event.preventDefault();
        group.classList.add('drag-over');
      });
      content.addEventListener('dragleave',event=>{
        if(!content.contains(event.relatedTarget)) group.classList.remove('drag-over');
      });
      content.addEventListener('drop',event=>{
        if(!draggedCard || event.target.closest('.card-row')) return;
        event.preventDefault();
        event.stopPropagation();
        draggedCard.sectionId = section.id;
        const fromIndex = draft.cards.indexOf(draggedCard);
        draft.cards.splice(fromIndex,1);
        draft.cards.push(draggedCard);
        draggedCard = null;
        group.classList.remove('drag-over');
        rebuildRows();
      });
      return group;
    };
    const roots = draft.sections.filter(section=>!draft.sections.some(parent=>parent.id===section.parentId));
    roots.forEach(section=>cardsContainer.appendChild(renderGroup(section)));
    const assignedIds = new Set(draft.sections.map(section=>section.id));
    const unassignedCards = draft.cards.filter(card=>!assignedIds.has(card.sectionId));
    if(unassignedCards.length || !draft.sections.length){
      const unassigned = document.createElement('details');
      unassigned.className = 'editor-unassigned';
      unassigned.open = expandedEditorSections.has('__unassigned__');
      unassigned.innerHTML = `<summary><span class="editor-section-name">Bez bloku</span><span class="editor-section-count">${studyCountLabel(unassignedCards.length,draft.type==='mixed'?'mixed':draft.type==='quiz')}</span></summary><div class="editor-section-content"></div>`;
      unassigned.addEventListener('toggle',()=>unassigned.open ? expandedEditorSections.add('__unassigned__') : expandedEditorSections.delete('__unassigned__'));
      const content = unassigned.querySelector('.editor-section-content');
      unassignedCards.forEach(card=>content.appendChild(buildRow(card,draft.cards.indexOf(card))));
      unassigned.addEventListener('dragover',event=>{
        if(!draggedCard || event.target.closest('.card-row')) return;
        event.preventDefault();
      });
      unassigned.addEventListener('drop',event=>{
        if(!draggedCard || event.target.closest('.card-row')) return;
        event.preventDefault();
        event.stopPropagation();
        draggedCard.sectionId = null;
        const fromIndex = draft.cards.indexOf(draggedCard);
        draft.cards.splice(fromIndex,1);
        draft.cards.push(draggedCard);
        draggedCard = null;
        rebuildRows();
      });
      cardsContainer.appendChild(unassigned);
    }
  }

  function rebuildRows(){
    renderEditorCardGroups();
    renderEditorSectionPanel();
  }
  rebuildRows();

  if(draft.type==='mixed'){
    editorColumn.appendChild(createAddCardButton(null));
  }else{
    const addBtn = document.createElement('button');
    addBtn.className = 'add-card-btn';
    addBtn.innerHTML = `${icon('plus',18)} ${draft.type==='quiz'?'Přidat otázku bez bloku':'Přidat kartičku bez bloku'}`;

  const footer = document.createElement('div');

  createBtnBottom.onclick = commitDraft;
  footer.appendChild(createBtnBottom);
  editorColumn.appendChild(footer);

  top.querySelector('#createTop').onclick = commitDraft;

  toolbar.querySelector('#importBtn').onclick = openImportModal;
  toolbar.querySelector('#ankiImportBtn').onclick = openAnkiImportModal;
  toolbar.querySelector('#suggSwitch').onclick = (e) => {

    e.currentTarget.classList.toggle('on');
  };
  toolbar.querySelector('#swapBtn').onclick = () => {
    draft.cards.forEach(c => { const t=c.term; c.term=c.def; c.def=t; });
