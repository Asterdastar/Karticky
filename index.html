  };
  toolbar.querySelector('#kbdBtn').onclick = () => showToast(`Tip: přetažením ikony ⠿ změníš pořadí ${draft.type==='quiz'?'otázek':'kartiček'}.`);
  toolbar.querySelector('#clearBtn').onclick = async () => {
    if(await confirmThemed(`Tímto smažeš všechny ${draft.type==='quiz'?'otázky':draft.type==='mixed'?'položky':'kartičky'} z této sady.`,{title:'Smazat celý obsah?',confirmLabel:'Smazat vše',danger:true})){
      draft.cards = draft.type==='quiz' ? [emptyQuizQuestion(),emptyQuizQuestion()] : draft.type==='mixed' ? [{...emptyCard(),kind:'flashcards'},{...emptyQuizQuestion(),kind:'quiz'}] : [emptyCard(),emptyCard()];
      rebuildRows();
    }
  };

  return wrap;
}

function openImportModal(){
  openModal(`
    <div class="modal-head"><h2>Importovat kartičky</h2><button class="modal-close" data-close>${icon('x',16)}</button></div>
    <p class="page-sub" style="margin-bottom:12px">Vlož dvojice pojem–definice. Odděl pojem od definice tabulátorem nebo čárkou a jednotlivé kartičky novým řádkem.</p>
    <textarea class="field-box import-textarea" id="importArea" placeholder="jablko, ovoce, které roste na stromě&#10;pes, domácí zvíře a věrný přítel"></textarea>
    <div class="import-opts">
      <label>Mezi pojmem a definicí<select id="sepBetween"><option value="tab">Tabulátor</option><option value=",">Čárka</option><option value=";">Středník</option></select></label>
      <label>Mezi kartičkami<select id="sepCards"><option value="\\n">Nový řádek</option><option value=";;">;;</option></select></label>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px">
      <button class="btn btn-ghost" data-close>Zrušit</button>
      <button class="btn btn-primary" id="doImport">Importovat</button>
    </div>
  `);
  document.getElementById('doImport').onclick = () => {
    const text = document.getElementById('importArea').value;
    const sepBetween = document.getElementById('sepBetween').value === 'tab' ? '\t' : document.getElementById('sepBetween').value;
    const sepCardsRaw = document.getElementById('sepCards').value;
    const lines = sepCardsRaw === '\\n' ? text.split('\n') : text.split(sepCardsRaw);
    const newCards = [];
    lines.forEach(line => {
      if(!line.trim()) return;
      const idx = line.indexOf(sepBetween);
      if(idx === -1) return;
      const term = line.slice(0, idx).trim();
      const def = line.slice(idx + sepBetween.length).trim();
      if(term || def) newCards.push(emptyCardWithText(term, def));
    });
    if(newCards.length === 0){ showToast('Nepodařilo se rozpoznat žádné kartičky.'); return; }
    if(draft.cards.length===1 && !draft.cards[0].term && !draft.cards[0].def) draft.cards = [];
    draft.cards.push(...newCards.map(card=>draft.type==='mixed'?{...card,kind:'flashcards'}:card));
    closeModal();
    state.view = 'create';
    render();
    showToast(`Přidáno ${newCards.length} kartiček.`);
  };
}

let ankiRuntimePromise = null;
const ANKI_JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const ANKI_SQLJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.min.js';
const ANKI_SQLJS_WASM_URL = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.wasm';
const ANKI_ZSTD_URL = 'https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js';

function loadScriptOnce(src, isLoaded){
  if(isLoaded()) return Promise.resolve();
  return new Promise((resolve,reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error('Knihovnu pro import se nepodařilo načíst.'));
    document.head.appendChild(script);
  });
}

function loadAnkiRuntime(){
  if(!ankiRuntimePromise){
    ankiRuntimePromise = (async () => {
      await loadScriptOnce(ANKI_JSZIP_URL, () => Boolean(window.JSZip));
      await loadScriptOnce(ANKI_SQLJS_URL, () => Boolean(window.initSqlJs));
      const SQL = await window.initSqlJs({ locateFile:() => ANKI_SQLJS_WASM_URL });
      return { JSZip:window.JSZip, SQL };
    })().catch(error => { ankiRuntimePromise = null; throw error; });
  }
  return ankiRuntimePromise;
}

async function loadAnkiZstd(){
  await loadScriptOnce(ANKI_ZSTD_URL,()=>Boolean(window.fzstd?.decompress));
  if(!window.fzstd?.decompress) throw new Error('Knihovnu pro komprimovaný export Anki se nepodařilo inicializovat.');
  return window.fzstd;
}

function decodeAnkiProto(bytes){
  const fields = new Map();
  let offset = 0;
  const readVarint = () => {
    let value = 0;
    let shift = 0;
    while(offset < bytes.length){
      const byte = bytes[offset++];
      value += (byte & 0x7f) * (2 ** shift);
      if((byte & 0x80) === 0) return value;
      shift += 7;
      if(shift > 63) throw new Error('Konfigurace typu poznámky Anki obsahuje neplatná protobuf data.');
    }
    throw new Error('Konfigurace typu poznámky Anki je neúplná.');
  };
  while(offset < bytes.length){
    const tag = readVarint();
    const fieldNumber = Math.floor(tag / 8);
    const wireType = tag % 8;
    let value;
    if(wireType === 0){
      value = readVarint();
    }else if(wireType === 1){
      value = bytes.subarray(offset,offset+8);
      offset += 8;
    }else if(wireType === 2){
      const length = readVarint();
      value = bytes.subarray(offset,offset+length);
      offset += length;
    }else if(wireType === 5){
      value = bytes.subarray(offset,offset+4);
      offset += 4;
    }else{
      throw new Error('Export Anki obsahuje nepodporovaný typ protobuf pole.');
    }
    if(offset > bytes.length) throw new Error('Konfigurace typu poznámky Anki je poškozená.');
    const values = fields.get(fieldNumber) || [];
    values.push({ wireType, value });
    fields.set(fieldNumber,values);
  }
  return fields;
}

function decodeAnkiProtoString(fields,fieldNumber){
  const value = fields.get(fieldNumber)?.find(field=>field.wireType===2)?.value;
  return value ? new TextDecoder().decode(value) : '';
}

function getAnkiMediaEntries(bytes,modernPackage){
  if(!modernPackage) return Object.entries(JSON.parse(new TextDecoder().decode(bytes))).map(([index,name])=>({index,name}));
  const mediaEntries = decodeAnkiProto(bytes).get(1) || [];
  return mediaEntries.filter(entry=>entry.wireType===2).map((entry,index)=>{
    const fields = decodeAnkiProto(entry.value);
    return { index:String(index), name:decodeAnkiProtoString(fields,1) };
  }).filter(entry=>entry.name);
}

function ankiBytesToBase64(bytes){
  let binary = '';
  for(let offset=0;offset<bytes.length;offset+=0x8000){
    binary += String.fromCharCode(...bytes.subarray(offset,offset+0x8000));
  }
  return btoa(binary);
}

function decodeMediaFilename(value){
  try{ return decodeURIComponent(value); }catch{ return value; }
}

function getModernAnkiModels(database){
  const notetypes = database.exec('SELECT id, name FROM notetypes')[0]?.values || [];
  const fieldRows = database.exec('SELECT ntid, ord, name FROM fields ORDER BY ntid, ord')[0]?.values || [];
  const templateRows = database.exec('SELECT ntid, ord, name, config FROM templates ORDER BY ntid, ord')[0]?.values || [];
  const fieldsByType = new Map();
  fieldRows.forEach(([typeId,ordinal,name])=>{
    const fields = fieldsByType.get(String(typeId)) || [];
    fields.push({ ord:Number(ordinal), name:String(name) });
    fieldsByType.set(String(typeId),fields);
  });
  const templatesByType = new Map();
  templateRows.forEach(([typeId,ordinal,name,config])=>{
    const configFields = decodeAnkiProto(config);
    const templates = templatesByType.get(String(typeId)) || [];
    templates.push({
      ord:Number(ordinal),
      name:String(name),
      qfmt:decodeAnkiProtoString(configFields,1),
      afmt:decodeAnkiProtoString(configFields,2),
    });
    templatesByType.set(String(typeId),templates);
  });
  return Object.fromEntries(notetypes.map(([id,name])=>[String(id),{
    name:String(name),
    flds:fieldsByType.get(String(id)) || [],
    tmpls:templatesByType.get(String(id)) || [],
  }]));
}

function ankiHtmlToText(html){
  const withoutImages = String(html || '').replace(/<img\b[^>]*>/gi,tag=>{
    const alt = decodeAnkiHtmlAttribute(getAnkiHtmlAttribute(tag,'alt'));
    return alt ? escapeHtml(alt) : '';
  });
  const holder = document.createElement('div');
  holder.innerHTML = withoutImages;
  holder.querySelectorAll('script,style').forEach(node => node.remove());
  holder.querySelectorAll('br').forEach(node => node.replaceWith('\n'));
  holder.querySelectorAll('p,div,li').forEach(node => node.append('\n'));
  return (holder.textContent || '').replace(/\u00a0/g,' ').replace(/[ \t]+\n/g,'\n').trim();
}

function getAnkiHtmlAttribute(tag,name){
  const match = tag.match(new RegExp(`\\b${name}\\s*=\\s*(?:"([^"]*)"|'([^']*)'|([^\\s>]+))`,'i'));
  return match ? match[1] ?? match[2] ?? match[3] ?? '' : '';
}

function decodeAnkiHtmlAttribute(value){
  const decoder = document.createElement('textarea');
  decoder.innerHTML = String(value || '');
  return decoder.value;
}

function renderAnkiCloze(value, ordinal){
  return String(value || '').replace(/\{\{c(\d+)::([\s\S]*?)\}\}/gi, (match, number, content) => {
    const split = content.indexOf('::');
    const answer = split < 0 ? content : content.slice(0,split);
    const hint = split < 0 ? '' : content.slice(split+2);
    return Number(number) === ordinal ? `[${hint || '…'}]` : answer;
  });
}

function renderAnkiTemplate(template, fields, ordinal, frontSide='', includeFrontSide=true){
  const fieldValues = new Map(Object.entries(fields).map(([name,value]) => [name.toLowerCase(),value]));
  let rendered = String(template || '').replace(/\{\{([#^])\s*([^}]+?)\s*\}\}([\s\S]*?)\{\{\/\s*\2\s*\}\}/g, (match, mode, name, body) => {
    const present = Boolean(fieldValues.get(name.trim().toLowerCase()));
    return (mode === '#' ? present : !present) ? body : '';
  });
  rendered = rendered.replace(/\{\{([^{}]+)\}\}/g, (match, token) => {
    const parts = token.split(':');
    const modifier = parts.length > 1 ? parts.shift().trim().toLowerCase() : '';
    const name = parts.join(':').trim();
    if(name.toLowerCase() === 'frontside') return includeFrontSide ? frontSide : '';
    const value = fieldValues.get(name.toLowerCase()) || '';
    if(modifier === 'cloze') return renderAnkiCloze(value,ordinal);
    if(modifier === 'text') return ankiHtmlToText(value);
    if(modifier === 'type') return '';
    return value;
  });
  return rendered;
}

function importAnkiSide(html, media){
  let image = null;
  let missingImages = 0;
  const withoutImages = String(html || '').replace(/<img\b[^>]*>/gi,tag=>{
    const source = decodeMediaFilename(decodeAnkiHtmlAttribute(getAnkiHtmlAttribute(tag,'src')));
    const alt = decodeAnkiHtmlAttribute(getAnkiHtmlAttribute(tag,'alt'));
    const matchedImage = media.get(source) || media.get(source.split(/[\\/]/).pop());
    if(matchedImage) image = image || matchedImage;
    else if(source && !/^data:image\/(?:png|jpe?g|gif|webp|svg\+xml|bmp|avif);base64,/i.test(source)) missingImages += 1;
    else if(source) image = image || source;
    return alt ? escapeHtml(alt) : '';
  });
  const cleaned = withoutImages.replace(/<hr\b[^>]*>/gi,'<br>').replace(/\[sound:[^\]]+\]/gi,'');
  return { text:sanitizeRichText(cleaned), image, missingImages };
}

function getAnkiOptionLabel(fieldName){
  const match = String(fieldName).match(/^(?:(?:option|choice|distractor|možnost|moznost)[\s_-]*)?([a-h1-8])$/i);
  return match ? match[1].toUpperCase() : null;
}

function detectAnkiQuiz(model, fields, media=new Map()){
  const definitions = Array.isArray(model.flds) ? model.flds : [];
  let options = definitions.map(field => ({ name:field.name, label:getAnkiOptionLabel(field.name), value:fields[field.name] || '' }))
    .filter(option => option.label && option.value.trim())
    .sort((a,b) => a.label.localeCompare(b.label,'en',{numeric:true}));
  const questionField = definitions.find(field => /question|prompt|stem|ot[aá]zka/i.test(field.name) && !getAnkiOptionLabel(field.name))
    || definitions.find(field => !getAnkiOptionLabel(field.name) && !/^(correct|solution|right|answer|spr[aá]vn[aá])/i.test(field.name));
  if(!questionField) return null;
  let questionValue = fields[questionField.name] || '';
  if(options.length < 2){
    const questionLines = ankiHtmlToText(questionValue).split(/\r?\n/);
    const candidates = [];
    questionLines.forEach((line,lineIndex) => {
      const match = line.match(/^\s*([A-H1-8])[).:\-]\s*(.+?)\s*$/i);
      if(match){
        const label = match[1].toUpperCase();
        const number = /^[A-H]$/.test(label) ? label.charCodeAt(0)-64 : Number(label);
        candidates.push({ name:label, label, value:match[2], lineIndex, number });
      }
    });
    let bestStart = 0;
    let bestLength = 0;
    let runStart = 0;
    let runLength = 0;
    candidates.forEach((candidate,index) => {
      if(index > 0 && candidate.number === candidates[index-1].number+1){
        runLength += 1;
      }else{
        runStart = index;
        runLength = 1;
      }
      if(runLength > bestLength){ bestStart = runStart; bestLength = runLength; }
    });
    if(bestLength >= 2){
      const parsedOptions = candidates.slice(bestStart,bestStart+bestLength);
      options = parsedOptions.map(({ name,label,value }) => ({ name,label,value }));
      questionValue = questionLines.slice(0,parsedOptions[0].lineIndex).join('\n').trim();
    }
  }
  if(options.length < 2) return null;
  const answerField = definitions.find(field => /^(correct(?:[ _-]+answer)?|right(?:[ _-]+answer)?|solution|answer|spr[aá]vn[aá](?:[ _-]+odpov[eě]ď)?)$/i.test(field.name));
  const answerMarker = /^(?:spr[aá]vn[aá]\s+odpov[eě]ď|correct(?:\s+answer)?|right(?:\s+answer)?|solution)\s*[:=\-]?\s*([A-H1-8])\s*(.*)$/i;
  const textFields = definitions.map(field => ({ name:field.name, text:ankiHtmlToText(fields[field.name] || '') }));
  const markedAnswer = textFields.map(source => ({ ...source, lines:source.text.split(/\r?\n/) }))
    .map(source => ({ ...source, matchIndex:source.lines.findIndex(line => answerMarker.test(line)) }))
    .find(source => source.matchIndex >= 0);
  const normalize = value => ankiHtmlToText(value).toLocaleLowerCase('cs').replace(/[\s.,:;()[\]]+/g,'');
  let correctValue = answerField ? fields[answerField.name] : '';
  if(markedAnswer){
    correctValue = markedAnswer.lines[markedAnswer.matchIndex].match(answerMarker)?.[1] || correctValue;
  }
  if(!correctValue){
    correctValue = definitions.filter(field => field !== questionField && !getAnkiOptionLabel(field.name))
      .map(field => fields[field.name] || '').find(value => options.some(option => normalize(option.value) === normalize(value) || normalize(option.label) === normalize(value) || normalize(option.name) === normalize(value))) || '';
  }
  const normalizedCorrect = normalize(correctValue);
  const correctIndex = options.findIndex(option => {
    const normalizedLabel = normalize(option.label);
    const normalizedName = normalize(option.name);
    return normalizedCorrect && (normalizedCorrect === normalize(option.value) || normalizedCorrect === normalizedLabel || normalizedCorrect === normalizedName || normalizedCorrect === `option${normalizedLabel}` || normalizedCorrect === `choice${normalizedLabel}`);
  });
  const explanationField = definitions.find(field => /explanation|rationale|vysv[eě]tlen[ií]|extra/i.test(field.name));
  const explanation = explanationField
    ? ankiHtmlToText(fields[explanationField.name])
    : markedAnswer ? [markedAnswer.lines[markedAnswer.matchIndex].match(answerMarker)?.[2] || '', ...markedAnswer.lines.slice(markedAnswer.matchIndex+1)].join('\n').trim() : '';
  const parsedOptions = options.map(option=>{
    const side = importAnkiSide(option.value,media);
    return { text:ankiHtmlToText(option.value), image:side.image, missingImages:side.missingImages };
  });
  const questionSide = importAnkiSide(questionValue,media);
  return {
    question:ankiHtmlToText(questionValue),
    questionImage:questionSide.image,
    missingImages:questionSide.missingImages + parsedOptions.reduce((total,option)=>total+option.missingImages,0),
    options:parsedOptions.map((option,index) => ({ text:option.text, image:option.image, correct:index === (correctIndex < 0 ? 0 : correctIndex) })),
    explanation,
    needsCorrectChoice:correctIndex < 0,
  };
}

function splitAnkiTextRow(line, separator){
  const fields = [];
  let value = '';
  let quoted = false;
  for(let index=0;index<line.length;index++){
    const character = line[index];
    if(character === '"'){
      if(quoted && line[index+1] === '"'){ value += '"'; index += 1; }
      else quoted = !quoted;
    }else if(character === separator && !quoted){
      fields.push(value);
      value = '';
    }else{
      value += character;
    }
  }
  fields.push(value);
  return fields;
}

function getAnkiDeckPath(fields, names){
  const deckField = names.find(name=>/^(?:deck|deck name|bal[ií]ček)$/i.test(name.trim()));
  const explicitDeck = deckField ? String(fields[deckField] || '').trim() : '';
  const taggedDeck = String(fields.Tags || fields.tags || fields.Štítky || '')
    .split(/\s+/)
    .find(tag=>/^deck:/i.test(tag));
  const deckName = explicitDeck || (taggedDeck ? taggedDeck.slice(taggedDeck.indexOf(':')+1) : '');
  return deckName.split('::').map(name=>name.trim()).filter(Boolean);
}

function getOrCreateAnkiSectionPath(path,sections,sectionByPath){
  let parentId = null;
  const currentPath = [];
  path.forEach(name=>{
    currentPath.push(name);
    const key = currentPath.join('::');
    let section = sectionByPath.get(key);
    if(!section){
      section = { id:uid(), name, parentId };
      sections.push(section);
      sectionByPath.set(key,section);
    }
    parentId = section.id;
  });
  return parentId;
}

function mergeImportedAnkiSections(targetSections,importedSections){
  const merged = normalizeSections(targetSections);
  const imported = normalizeSections(importedSections);
  const idMap = new Map();
  const pending = [...imported];
  while(pending.length){
    const readyIndex = pending.findIndex(section=>!section.parentId || idMap.has(section.parentId));
    if(readyIndex < 0) break;
    const [section] = pending.splice(readyIndex,1);
    const parentId = section.parentId ? idMap.get(section.parentId) : null;
    const matching = merged.find(existing=>existing.parentId===parentId && existing.name===section.name);
    const id = matching?.id || (merged.some(existing=>existing.id===section.id) ? uid() : section.id);
    if(!matching) merged.push({ ...section, id, parentId });
    idMap.set(section.id,id);
  }
  return { sections:merged, sectionIdMap:idMap };
}

function getAnkiCardsInSourceOrder(parsed){
  if(Array.isArray(parsed.orderedCards)) return parsed.orderedCards;
  return [
    ...(parsed.flashcards || []).map(card=>({ card, kind:'flashcards' })),
    ...(parsed.quizCards || []).map(card=>({ card, kind:'quiz' })),
  ];
}

function getAnkiQuizCards(parsed){
  return getAnkiCardsInSourceOrder(parsed).map(({card,kind})=>{
    if(kind === 'quiz') return card;
    if(!ankiHtmlToText(card.term) || !ankiHtmlToText(card.def)) return null;
    return {
      question:ankiHtmlToText(card.term),
      questionImage:card.termImage || null,
      explanation:'',
      sectionId:card.sectionId || null,
      options:[{ text:ankiHtmlToText(card.def), image:card.defImage || null, correct:true },{ text:'Nevím', image:null, correct:false }],
    };
  }).filter(Boolean);
}

async function parseAnkiTextExport(file){
  const source = (await file.text()).replace(/^\uFEFF/,'');
  let separator = '\t';
  let columns = [];
  let defaultDeck = '';
  const dataLines = [];
  source.split(/\r?\n/).forEach(line => {
    if(line.startsWith('#separator:')){
      const value = line.slice('#separator:'.length).trim().toLowerCase();
      separator = ({ tab:'\t', comma:',', semicolon:';', pipe:'|' })[value] || value;
    }else if(line.startsWith('#columns:')){
      columns = splitAnkiTextRow(line.slice('#columns:'.length),separator).map(name=>name.trim()).filter(Boolean);
    }else if(line.startsWith('#deck:')){
      defaultDeck = line.slice('#deck:'.length).trim();
    }else if(line.startsWith('#') || !line.trim()){
      return;
    }else{
      dataLines.push(line);
    }
  });
  const flashcards = [];
  const quizCards = [];
  const orderedCards = [];
  const sections = [];
  const sectionByPath = new Map();
  let uncheckedAnswers = 0;
  let missingImages = 0;
  dataLines.forEach(line => {
    const values = splitAnkiTextRow(line,separator);
    if(values.length < 2) return;
    const names = columns.length ? columns : values.map((value,index)=>index===0?'Front':index===1?'Back':`Field ${index+1}`);
    const fields = Object.fromEntries(names.map((name,index)=>[name,values[index] || '']));
    const sectionPath = getAnkiDeckPath(fields,names);
    if(!sectionPath.length && defaultDeck) sectionPath.push(...defaultDeck.split('::').map(name=>name.trim()).filter(Boolean));
    const sectionId = sectionPath.length ? getOrCreateAnkiSectionPath(sectionPath,sections,sectionByPath) : null;
    const model = { flds:names.map(name=>({ name })) };
    const question = detectAnkiQuiz(model,fields);
    if(question){
      if(question.needsCorrectChoice) uncheckedAnswers += 1;
      missingImages += question.missingImages;
      const { missingImages:questionMissingImages, ...quizCard } = question;
      const importedCard = { ...quizCard, sectionId };
      quizCards.push(importedCard);
      orderedCards.push({ card:importedCard, kind:'quiz' });
      return;
    }
    const front = importAnkiSide(values[0],new Map());
    const backHtml = values[1];
    const backText = ankiHtmlToText(backHtml);
    const frontText = ankiHtmlToText(values[0]);
    const answerText = frontText && backText.startsWith(frontText) ? backText.slice(frontText.length).trim() : '';
    const back = answerText
      ? { text:escapeHtml(answerText).replace(/\r?\n/g,'<br>'), image:null }
      : importAnkiSide(backHtml,new Map());
    missingImages += front.missingImages + back.missingImages;
    if(front.text || back.text){
      const importedCard = { term:front.text, def:back.text, termImage:null, defImage:null, sectionId };
      flashcards.push(importedCard);
      orderedCards.push({ card:importedCard, kind:'flashcards' });
    }
  });
  const detectedType = quizCards.length > flashcards.length ? 'quiz' : 'flashcards';
  const warnings = [];
  if(!sections.length) warnings.push('Textový export neobsahuje názvy balíčků. Pro automatické rozdělení podle Anki použij export .apkg.');
  if(missingImages) warnings.push(`V textovém exportu se nepodařilo najít ${missingImages} obrázků.`);
  return {
    title:file.name.replace(/\.(?:apkg|txt|tsv)$/i,''),
    detectedType, flashcards, quizCards, orderedCards, sections, uncheckedAnswers,
    missingImages,
    structureWarning:warnings.join(' '),
  };
}

async function parseAnkiPackage(file){
  const { JSZip, SQL } = await loadAnkiRuntime();
  const archive = await JSZip.loadAsync(file);
  const modernDatabaseFile = archive.file('collection.anki21b');
  const databaseFile = modernDatabaseFile || archive.file('collection.anki21') || archive.file('collection.anki2');
  if(!databaseFile) throw new Error('V balíčku se nenašla podporovaná databáze Anki. Použij export .apkg nebo .colpkg.');
  let databaseBytes = new Uint8Array(await databaseFile.async('uint8array'));
  if(modernDatabaseFile){
    try{
      const zstd = await loadAnkiZstd();
      databaseBytes = zstd.decompress(databaseBytes);
    }catch(error){
      throw new Error(`Komprimovanou databázi Anki se nepodařilo rozbalit: ${error.message}`);
    }
  }
  const database = new SQL.Database(databaseBytes);
  try{
    let models;
    let deckNames;
    if(modernDatabaseFile){
      models = getModernAnkiModels(database);
      const decks = database.exec('SELECT id, name FROM decks')[0]?.values || [];
      deckNames = new Map(decks.map(([id,name])=>[String(id),String(name || '')]));
    }else{
      const modelRows = database.exec('SELECT models FROM col LIMIT 1')[0]?.values?.[0]?.[0];
      if(!modelRows) throw new Error('Export Anki neobsahuje definice typů poznámek.');
      models = JSON.parse(modelRows);
      const deckRows = database.exec('SELECT decks FROM col LIMIT 1')[0]?.values?.[0]?.[0];
      const decks = deckRows ? JSON.parse(deckRows) : {};
      deckNames = new Map(Object.entries(decks).map(([id,deck])=>[String(id),String(deck.name || '')]));
    }
    if(!Object.keys(models).length) throw new Error('Export Anki neobsahuje definice typů poznámek.');
    const notes = database.exec('SELECT id, mid, flds, tags FROM notes ORDER BY id')[0]?.values || [];
    const cards = database.exec('SELECT nid, ord, did FROM cards ORDER BY id')[0]?.values || [];
    const cardsByNote = new Map();
    cards.forEach(([noteId,ordinal,deckId]) => {
      const list = cardsByNote.get(String(noteId)) || [];
      list.push({ ordinal:Number(ordinal), deckId:String(deckId) });
      cardsByNote.set(String(noteId),list);
    });
    const sections = [];
    const sectionByPath = new Map();
    const sectionIdForDeck = deckId => {
      const deckName = deckNames.get(String(deckId)) || '';
      const path = deckName.split(/::|\u001f/).map(name=>name.trim()).filter(Boolean);
      if(path[0] === 'Default') path.shift();
      return path.length ? getOrCreateAnkiSectionPath(path,sections,sectionByPath) : null;
    };

    const media = new Map();
    let missingImages = 0;
    const mediaIndex = archive.file('media');
    if(mediaIndex){
      const zstd = modernDatabaseFile ? await loadAnkiZstd() : null;
      let mediaList = new Uint8Array(await mediaIndex.async('uint8array'));
      if(zstd) mediaList = zstd.decompress(mediaList);
      let mediaEntries;
      try{
        mediaEntries = getAnkiMediaEntries(mediaList,Boolean(modernDatabaseFile));
      }catch(error){
        throw new Error(`Seznam médií v balíčku Anki se nepodařilo načíst: ${error.message}`);
      }
      const mediaTypes = { png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',bmp:'image/bmp',avif:'image/avif' };
      for(const {index, name:originalName} of mediaEntries){
        const fileName = decodeMediaFilename(originalName);
        const extension = fileName.split('.').pop().toLowerCase();
        const mime = mediaTypes[extension];
        const entry = mime && archive.file(index);
        if(mime && !entry) throw new Error(`V balíčku chybí soubor s obrázkem „${originalName}“.`);
        if(entry){
          let imageBytes = new Uint8Array(await entry.async('uint8array'));
          if(zstd) imageBytes = zstd.decompress(imageBytes);
          const dataUrl = `data:${mime};base64,${ankiBytesToBase64(imageBytes)}`;
          media.set(originalName,dataUrl);
          media.set(fileName,dataUrl);
        }
      }
    }

    const flashcards = [];
    const quizCards = [];
    const orderedCards = [];
    let uncheckedAnswers = 0;
    notes.forEach(([noteId,modelId,rawFields,tags]) => {
      const model = models[String(modelId)];
      if(!model) return;
      const definitions = Array.isArray(model.flds) ? model.flds : [];
      const values = String(rawFields || '').split('\x1f');
      const fields = Object.fromEntries(definitions.map((field,index) => [field.name,values[index] || '']));
      fields.Tags = tags || '';
      const multipleChoice = detectAnkiQuiz(model,fields,media);
      if(multipleChoice){
        missingImages += multipleChoice.missingImages;
        if(multipleChoice.needsCorrectChoice) uncheckedAnswers += 1;
        const modelCards = cardsByNote.get(String(noteId)) || [];
        const quizCard = { ...multipleChoice };
        delete quizCard.missingImages;
        const importedCard = { ...quizCard, sectionId:modelCards.length ? sectionIdForDeck(modelCards[0].deckId) : null };
        quizCards.push(importedCard);
        orderedCards.push({ card:importedCard, kind:'quiz' });
        return;
      }
      const modelCards = cardsByNote.get(String(noteId)) || [{ ordinal:0, deckId:null }];
      modelCards.forEach(({ordinal,deckId}) => {
        const template = (model.tmpls || []).find(item => Number(item.ord) === ordinal) || (model.tmpls || [])[0];
        const questionHtml = template ? renderAnkiTemplate(template.qfmt,fields,ordinal+1) : definitions[0] ? fields[definitions[0].name] : '';
        const answerHtml = template ? renderAnkiTemplate(template.afmt,fields,ordinal+1,questionHtml,false) : definitions[1] ? fields[definitions[1].name] : '';
        const question = importAnkiSide(questionHtml,media);
        const answer = importAnkiSide(answerHtml,media);
        missingImages += question.missingImages + answer.missingImages;
        if(question.text || answer.text || question.image || answer.image){
          const importedCard = { term:question.text, def:answer.text, termImage:question.image, defImage:answer.image, sectionId:deckId ? sectionIdForDeck(deckId) : null };
          flashcards.push(importedCard);
          orderedCards.push({ card:importedCard, kind:'flashcards' });
        }
      });
    });
    const detectedType = quizCards.length > flashcards.length ? 'quiz' : 'flashcards';
    const structureWarning = missingImages ? ` V balíčku se nepodařilo najít ${missingImages} obrázků.` : '';
    return { title:file.name.replace(/\.(?:apkg|colpkg)$/i,''), detectedType, flashcards, quizCards, orderedCards, sections, uncheckedAnswers, missingImages, structureWarning };
  }finally{
    database.close();
  }
}

function openAnkiImportModal(){
  openModal(`
    <div class="modal-head"><h2>Importovat z Anki</h2><button class="modal-close" data-close>${icon('x',16)}</button></div>
    <p class="page-sub">Vyber balíček .apkg/.colpkg nebo textový export .txt/.tsv. Typ obsahu rozpoznám podle polí a před importem ho můžeš změnit.</p>
    <input class="field-box" id="ankiFileInput" type="file" accept=".apkg,.colpkg,.txt,.tsv,application/octet-stream,text/plain">
    <p class="page-sub" id="ankiImportStatus" role="status">Soubor se zpracuje v tomto prohlížeči.</p>
    <div id="ankiImportSummary" hidden>
      <label class="class-field-label" for="ankiImportType">Importovat jako</label>
      <select class="opt-select" id="ankiImportType"><option value="flashcards">Pouze kartičky</option><option value="quiz">Pouze kvíz ABC</option><option value="mixed">Mix kartiček a kvízu</option></select>
      <p class="page-sub" id="ankiImportDetails"></p>
    </div>
    <div class="class-modal-actions"><button class="btn btn-ghost" data-close>Zrušit</button><button class="btn btn-primary" id="doAnkiImport" disabled>Importovat</button></div>
  `, true);
  const fileInput = document.getElementById('ankiFileInput');
  const status = document.getElementById('ankiImportStatus');
  const summary = document.getElementById('ankiImportSummary');
  const typeSelect = document.getElementById('ankiImportType');
  const details = document.getElementById('ankiImportDetails');
  const importButton = document.getElementById('doAnkiImport');
  let parsed = null;
  const updateImportState = () => {
    if(!parsed) return;
    const quizCards = getAnkiQuizCards(parsed);
    const selectedCards = typeSelect.value === 'quiz' ? quizCards
      : typeSelect.value === 'mixed' ? getAnkiCardsInSourceOrder(parsed)
      : parsed.flashcards;
    importButton.disabled = !selectedCards?.length;
    const mixed = parsed.quizCards.length > 0 && parsed.flashcards.length > 0;
    details.textContent = `Nalezeno ${parsed.flashcards.length} běžných dvojic a ${parsed.quizCards.length} ABC otázek.${parsed.sections?.length?` Automaticky rozpoznáno bloků: ${parsed.sections.length}.`:''}${parsed.structureWarning?` ${parsed.structureWarning}`:''}${mixed?` Soubor obsahuje oba typy; vyber samostatný režim, nebo je importuj společně jako mix.`:''}${typeSelect.value === 'quiz' && parsed.flashcards.length?` Běžné dvojice se převedou na odpověď a možnost „Nevím“.`:''}${parsed.uncheckedAnswers?` U ${parsed.uncheckedAnswers} otázek zkontroluj správnou možnost.`:''}`;
  };
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if(!file) return;
    parsed = null;
    summary.hidden = true;
    importButton.disabled = true;
    status.textContent = 'Čtu soubor a rozpoznávám jeho strukturu…';
    try{
      parsed = /\.(?:txt|tsv)$/i.test(file.name) ? await parseAnkiTextExport(file) : await parseAnkiPackage(file);
      typeSelect.value = parsed.quizCards.length && parsed.flashcards.length ? 'mixed' : parsed.detectedType;
      summary.hidden = false;
      status.textContent = `Načteno: ${file.name}`;
      updateImportState();
    }catch(error){
      status.textContent = error.message || 'Balíček se nepodařilo načíst.';
    }
  };
  typeSelect.onchange = updateImportState;
  importButton.onclick = async () => {
    const type = typeSelect.value;
    const importedCards = type === 'quiz' ? getAnkiQuizCards(parsed)
      : type === 'mixed' ? getAnkiCardsInSourceOrder(parsed).map(({card,kind})=>({...card,kind}))
      : parsed?.flashcards;
    if(!importedCards?.length) return;
    if(!draft.title.trim()) draft.title = parsed.title;
    const hasExistingContent = draft.cards.some(card => isQuizCard(card,draft)
      ? card.question || card.questionImage || card.options?.some(option => option.text || option.image)
      : card.term || card.def || card.termImage || card.defImage || card.image);
    if(hasExistingContent && draft.type !== type && draft.type !== 'mixed'){
      if(!await confirmThemed('Import má jiný typ než současný obsah. Dosavadní položky budou nahrazeny.',{title:'Nahradit obsah importem?',confirmLabel:'Nahradit',danger:true})) return;
      draft.cards = [];
    }else if(!hasExistingContent){
      draft.cards = [];
    }
    if(type==='mixed' || draft.type==='mixed'){
      draft.type = 'mixed';
      importedCards.forEach(card=>{ if(!card.kind) card.kind = type==='quiz'?'quiz':'flashcards'; });
    }else draft.type = type;
    const mergedSections = mergeImportedAnkiSections(draft.sections,parsed.sections || []);
    draft.sections = mergedSections.sections;
    draft.cards.push(...importedCards.map(card=>({
      ...card,
      sectionId:mergedSections.sectionIdMap.get(card.sectionId) || card.sectionId || null,
    })));
    closeModal();
    state.view = 'create';
    render();
    const warning = type !== 'flashcards' && parsed.uncheckedAnswers ? ` Zkontroluj správnou odpověď u ${parsed.uncheckedAnswers} otázek.` : '';
    showToast(`Importováno ${importedCards.length} ${type==='quiz'?'otázek':type==='mixed'?'položek':'kartiček'}.${warning}`);
  };
}

async function commitDraft(){
  if(draftSaveInProgress) return;
  if(!draft.title.trim()){ showToast('Zadej prosím název sady.'); return; }
  const validCards = draft.cards.filter(card => isQuizCard(card,draft)
    ? String(card.question || '').trim() || card.questionImage
    : String(card.term || '').trim() || String(card.def || '').trim() || card.termImage || card.defImage || card.image);
  if(validCards.length === 0){ showToast(draft.type==='quiz'?'Přidej alespoň jednu otázku.':draft.type==='mixed'?'Přidej alespoň jednu kartičku nebo otázku.':'Přidej alespoň jednu kartičku s pojmem nebo definicí.'); return; }
  const quizCards = validCards.filter(card=>isQuizCard(card,draft));
  if(quizCards.length){
    const invalidQuestion = quizCards.find(card => !Array.isArray(card.options) || card.options.length < 2 || card.options.length > 8 || card.options.some(option => !String(option.text || '').trim() && !option.image) || card.options.filter(option => option.correct).length !== 1);
    if(invalidQuestion){ showToast('Každá otázka musí mít 2–8 vyplněných odpovědí a právě jednu správnou.'); return; }
  }
  draftSaveInProgress = true;
  const saveButtons = [...document.querySelectorAll('#createTop,.create-footer button')];
  saveButtons.forEach(button => { button.disabled = true; button.textContent = 'Ukládám…'; });
  const restoreSaveButtons = message => {
    const status = document.getElementById('createSaveStatus');
    if(status){
      status.textContent = message;
      status.classList.add('visible');
    }
    saveButtons.forEach(button => {
      button.disabled = false;
      button.textContent = 'Zkusit znovu';
    });
  };
  const clearSaveStatus = () => {
    const status = document.getElementById('createSaveStatus');
    if(status){ status.textContent = ''; status.classList.remove('visible'); }
  };
  try{
    for(const card of validCards) if(isQuizCard(card,draft)){
      card.questionImage = await compactCardImage(card.questionImage);
      for(const option of card.options) option.image = await compactCardImage(option.image);
    }else{
        card.termImage = await compactCardImage(card.termImage);
        card.defImage = await compactCardImage(card.defImage);
        card.image = await compactCardImage(card.image);
    }
  }catch(error){
    draftSaveInProgress = false;
    const message = error.message || 'Obrázek se nepodařilo připravit k uložení.';
    restoreSaveButtons(message);
    showToast(message);
    return;
  }
  draft.cards = validCards;
  const now = Date.now();
  if(state.adminEditingSet){
    const { userId, payload:savedPayload } = state.adminEditingSet;
    const nextSet = { ...draft, updatedAt:now };
    const setIndex = savedPayload.sets.findIndex(set => set.id === draft.id);
    if(setIndex < 0){ draftSaveInProgress = false; const message='Sada už v tomto účtu neexistuje. Obnov přehled a zkus to znovu.'; restoreSaveButtons(message); showToast(message); return; }
    const nextPayload = { ...savedPayload, sets:[...savedPayload.sets] };
    nextPayload.sets[setIndex] = nextSet;
    let storedPayload;
    try{ storedPayload = await preparePayloadImages(nextPayload,userId); }
    catch(error){ draftSaveInProgress = false; const message='Uložení obrázků se nezdařilo: ' + (error?.message || 'Zkontroluj nastavení úložiště.'); restoreSaveButtons(message); showToast(message); return; }
    const storedSet = storedPayload.sets[setIndex];
    const { error } = await supabaseClient.from('flashcard_data').upsert({ user_id:userId, payload:storedPayload, updated_at:new Date().toISOString() });
    if(error){ draftSaveInProgress = false; const message='Uložení se nezdařilo: ' + error.message; restoreSaveButtons(message); showToast(message); return; }
    if(currentUser?.id === userId){ clearTimeout(cloudSaveTimer); loadData(storedPayload); }
    const { error:marketplaceError } = await supabaseClient.from('marketplace_sets').upsert({
      owner_id:userId,
      set_id:storedSet.id,
      set_type:getSetType(storedSet),
      title:storedSet.title || 'Bez názvu',
      description:storedSet.description || '',
      subject_code:(storedSet.subjectCode || '').trim().toUpperCase(),
      subject_id:storedSet.className && storedPayload.classVisibility?.[storedSet.className] === true ? storedSet.className : null,
      cards:storedSet.cards,
      sections:storedSet.sections || [],
      is_public:storedSet.isPublic === true,
      updated_at:new Date().toISOString(),
    });
    draft = null;
    state.adminEditingSet = null;
    state.editingSetId = null;
    state.view = 'admin-sets';
    draftSaveInProgress = false;
    render();
    showToast(marketplaceError?'Sada byla uložena, ale její synchronizace s burzou selhala: ' + marketplaceError.message:'Sada byla uložena.');
    return;
  }
  const idx = state.sets.findIndex(s => s.id === draft.id);
  const previousSet = idx >= 0 ? state.sets[idx] : null;
  if(idx >= 0){
    state.sets[idx] = { ...draft, updatedAt: now };
  } else {
    state.sets.push({ ...draft, createdAt: now, updatedAt: now });
  }
  const saveResult = await flushCloudSave();
  draftSaveInProgress = false;
  if(!saveResult.saved){
    if(previousSet) state.sets[idx] = previousSet;
    else state.sets = state.sets.filter(set => set.id !== draft.id);
    const message = saveResult.warning || 'Uložení se nezdařilo. Zkontroluj připojení a zkus to znovu.';
    restoreSaveButtons(message);
    showToast(message);
    return;
  }
  clearSaveStatus();
  draft = null;
  showToast(saveResult.warning || 'Sada byla uložena.');
  state.study = null;
  state.view = draftReturnView;
  render();
}

/* ============================= STUDY ============================= */
function openStudy(setId){
  const s = state.sets.find(x=>x.id===setId);
  if(!s) return;
  if(!s.starred) s.starred = [];
  state.study = {
    setId,
    queue:[],
    pointer: 0,
    roundTotal: s.cards.length,
    reviewed: 0,
    flipped: false,
    showHint: false,
    history: [],
    wrong: [],
    settings: userStudySettings,
    selectedSectionIds:[...normalizeSections(s.sections).map(section=>section.id),'__unassigned__'],
  };
  initQueueFromSettings();
  state.view = 'study';
  render();
}

function currentSet(){ return state.sets.find(s=>s.id===state.study.setId); }

function recordStudyProgress(setId, remaining, total){
  state.progress[setId] = { remaining, total, updatedAt:Date.now() };
  saveProgress();
}

function setTrackProgress(enabled){
  userStudySettings.trackProgress = enabled;
  saveStudySettings();
  if(state.study) state.study.settings = userStudySettings;
  document.querySelectorAll('#trackSwitch, #mTrack').forEach(toggle => toggle.classList.toggle('on', enabled));
}

function initQueueFromSettings(){
  const s = currentSet();
  const st = state.study;
  const selected = new Set(st.selectedSectionIds || []);
  const knownSectionIds = new Set(normalizeSections(s.sections).map(section=>section.id));
  const sectionIndices = s.cards.map((_,i)=>i).filter(index=>{
    const sectionId = s.cards[index].sectionId;
    return sectionId && knownSectionIds.has(sectionId) ? selected.has(sectionId) : selected.has('__unassigned__');
  });
  let indices = sectionIndices;
  if(st.settings.starredOnly){
    const starred = sectionIndices.filter(i => (s.starred||[]).includes(i));
    if(starred.length) indices = starred;
  }
  st.queue = indices;
  st.pointer = 0;
  st.roundTotal = indices.length;
  st.reviewed = 0;
  st.flipped = false;
  st.history = [];
  st.wrong = [];
  st.answered = false;
  st.selectedAnswer = null;
  st.answerCorrect = false;
}

function renderStudySectionPanel(set, study){
  const overlay = document.createElement('div');
  overlay.id = 'studySectionOverlay';
  overlay.className = 'study-section-overlay';
  overlay.setAttribute('aria-hidden','true');
  overlay.innerHTML = `<button type="button" class="study-section-backdrop" aria-label="Zavřít nabídku bloků"></button><aside class="section-panel study-section-drawer" role="dialog" aria-modal="true" aria-labelledby="studySectionTitle"><div class="study-section-drawer-header"><h2 id="studySectionTitle">Bloky k procvičení</h2><button type="button" class="icon-btn" data-close-section-menu aria-label="Zavřít bloky k procvičení" title="Zavřít">${icon('x',18)}</button></div><div class="section-panel-content"><div class="section-tree"></div><div class="section-panel-actions"><button type="button" class="btn btn-outline btn-sm" data-select-all>Vše</button><button type="button" class="btn btn-primary btn-sm" data-apply-sections>Potvrdit</button></div></div></aside>`;
  const panel = overlay.querySelector('.study-section-drawer');
  const content = panel.querySelector('.section-panel-content');
  const tree = panel.querySelector('.section-tree');
  const sections = normalizeSections(set.sections);
  const selected = new Set(study.selectedSectionIds || []);
  const unassignedIndices = set.cards.map((card,index)=>({card,index})).filter(({card})=>!card.sectionId || !sections.some(section=>section.id===card.sectionId)).map(({index})=>index);
  const refreshChecks = () => {
    tree.querySelectorAll('[data-section-select]').forEach(input=>{
      const descendants = sectionDescendantIds(sections,input.dataset.sectionSelect);
      const checkedCount = descendants.filter(id=>selected.has(id)).length;
      input.checked = checkedCount === descendants.length;
      input.indeterminate = checkedCount > 0 && checkedCount < descendants.length;
    });
    const unassigned = tree.querySelector('[data-section-select="__unassigned__"]');
    if(unassigned) unassigned.checked = selected.has('__unassigned__');
  };
  const renderNode = (section,depth=0) => {
    const children = sections.filter(item=>item.parentId===section.id);
    const node = document.createElement(children.length ? 'details' : 'div');
    node.className = 'section-tree-node';
    const rowMarkup = `<input class="section-tree-check" type="checkbox" data-section-select="${escapeHtml(section.id)}" aria-label="Procvičovat blok ${escapeHtml(section.name)}"><span class="section-tree-label">${escapeHtml(section.name)}</span>`;
    if(children.length){
      node.open = depth === 0;
      node.innerHTML = `<summary>${rowMarkup}</summary><div class="section-tree-children"></div>`;
    }else{
      node.classList.add('section-tree-leaf');
      node.innerHTML = `<div class="section-tree-row">${rowMarkup}</div>`;
    }
    node.querySelector('[data-section-select]').onchange = event => {
      const descendants = sectionDescendantIds(sections,section.id);
      descendants.forEach(id=>event.target.checked ? selected.add(id) : selected.delete(id));
      refreshChecks();
    };
    node.querySelector('[data-section-select]').onclick = event => event.stopPropagation();
    children.forEach(child=>node.querySelector('.section-tree-children').appendChild(renderNode(child,depth+1)));
    return node;
  };
  const roots = sections.filter(section=>!sections.some(parent=>parent.id===section.parentId));
  roots.forEach(section=>tree.appendChild(renderNode(section)));
  if(unassignedIndices.length){
    const unassigned = document.createElement('label');
    unassigned.className = 'section-tree-node';
    unassigned.innerHTML = `<span style="display:flex;align-items:center;gap:8px;min-height:34px"><input class="section-tree-check" type="checkbox" data-section-select="__unassigned__"><span class="section-tree-label">Bez bloku</span><span class="section-tree-count">${unassignedIndices.length}</span></span>`;
    unassigned.querySelector('input').onchange = event => {
      if(event.target.checked) selected.add('__unassigned__');
      else selected.delete('__unassigned__');
    };
    tree.appendChild(unassigned);
  }
  if(!sections.length && !unassignedIndices.length){
    content.querySelector('.section-panel-empty').textContent = 'Tato sada zatím nemá žádné bloky.';
  }
  refreshChecks();
  panel.querySelector('[data-select-all]').onclick = () => {
    sections.forEach(section=>selected.add(section.id));
    if(unassignedIndices.length) selected.add('__unassigned__');
    refreshChecks();
  };
  panel.querySelector('[data-apply-sections]').onclick = () => {
    const indices = set.cards.map((card,index)=>({card,index})).filter(({card})=>{
      const sectionId = card.sectionId && sections.some(section=>section.id===card.sectionId) ? card.sectionId : '__unassigned__';
      return selected.has(sectionId);
    }).map(({index})=>index);
    if(!indices.length){ showToast('Vyber alespoň jeden blok s kartičkami.'); return; }
    study.selectedSectionIds = [...selected];
    if(study.settings.starredOnly){
      const starred = indices.filter(index=>(set.starred || []).includes(index));
      if(starred.length) indices.splice(0,indices.length,...starred);
      else showToast('Ve vybraných blocích nejsou označené kartičky; opakuji všechny vybrané.');
    }
    study.queue = indices;
    study.pointer = 0;
    study.roundTotal = indices.length;
    study.reviewed = 0;
    study.flipped = false;
    study.history = [];
    study.wrong = [];
    study.answered = false;
    study.selectedAnswer = null;
    study.answerCorrect = false;
    render();
    const setType = getSetType(set);
    showToast(`Výběr potvrzen: ${studyCountLabel(indices.length,setType==='mixed'?'mixed':setType==='quiz')}.`);
  };
  return overlay;
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'cs-CZ';
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function renderStudy(){
  const s = currentSet();
  const st = state.study;
  const wrap = document.createElement('div');
  wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.flex='1'; wrap.style.minHeight='100vh';

  const topbar = document.createElement('div');
  topbar.className = 'study-topbar';
  topbar.innerHTML = `
    <div class="study-topbar-left">
      <button class="icon-btn" id="backBtn">${icon('back',18)}</button>
      <span class="study-title">${escapeHtml(s.title)}</span>
    </div>
    <div class="study-topbar-actions">
      <button class="btn btn-outline btn-sm" id="editSetBtn">${icon('pencil',14)} Upravit</button>
      <button type="button" class="icon-btn" id="studySectionToggle" aria-label="Otevřít bloky k procvičení" title="Bloky k procvičení" aria-expanded="false" aria-controls="studySectionOverlay">${icon('filter',18)}</button>
    </div>
  `;
  topbar.querySelector('#backBtn').onclick = () => { state.view='library'; state.study=null; render(); };
  topbar.querySelector('#editSetBtn').onclick = () => startEdit(s.id);
  wrap.appendChild(topbar);

  const body = document.createElement('div');
  body.className = 'study-body';
  const layout = document.createElement('div');
  const setType = getSetType(s);
  layout.className = `study-layout${setType==='mixed'?' mixed-study':''}${setType!=='flashcards'?' has-quiz':''}`;
  layout.append(body);
  const sectionOverlay = renderStudySectionPanel(s,st);
  const sectionToggle = topbar.querySelector('#studySectionToggle');
  const closeSectionMenu = () => {
    sectionOverlay.classList.remove('is-open');
    sectionOverlay.setAttribute('aria-hidden','true');
    sectionToggle.setAttribute('aria-expanded','false');
  };
  sectionOverlay.addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      event.preventDefault();
      event.stopPropagation();
      closeSectionMenu();
      sectionToggle.focus();
      return;
    }
    if(event.key==='Tab'){
      const focusable = [...sectionOverlay.querySelectorAll('button:not(:disabled),input:not(:disabled)')];
      const first = focusable[0];
      const last = focusable[focusable.length-1];
      if(event.shiftKey && document.activeElement===first){ event.preventDefault(); last.focus(); }
      else if(!event.shiftKey && document.activeElement===last){ event.preventDefault(); first.focus(); }
    }
  });
  sectionToggle.onclick = () => {
    const isOpen = sectionOverlay.classList.toggle('is-open');
    sectionOverlay.setAttribute('aria-hidden',String(!isOpen));
    sectionToggle.setAttribute('aria-expanded',String(isOpen));
    if(isOpen) setTimeout(()=>{
      if(sectionOverlay.classList.contains('is-open')) sectionOverlay.querySelector('[data-close-section-menu]').focus();
    },240);
  };
  sectionOverlay.querySelector('[data-close-section-menu]').onclick = () => {
    closeSectionMenu();
    sectionToggle.focus();
  };
  sectionOverlay.querySelector('.study-section-backdrop').onclick = () => {
    closeSectionMenu();
    sectionToggle.focus();
  };
  wrap.append(layout,sectionOverlay);

  if(st.queue.length === 0){
    const canPracticeWrong = st.settings.trackProgress && st.wrong.length > 0;
    body.innerHTML = `
      <div class="done-panel">
        <div class="emoji">🎉</div>
        <h2>Skvělá práce!</h2>
        <p>Prošel(a) jsi ${setType==='quiz'?'všechny otázky':setType==='mixed'?'všechny položky':'všechny kartičky'} v této sadě.</p>
        <div class="done-actions">
          ${canPracticeWrong ? '<button class="btn btn-ghost" id="wrongBtn">Procvičit, co neumím</button>' : ''}
          <button class="btn btn-ghost" id="restartBtn2">Začít znovu</button>
          <button class="btn btn-primary" id="libBtn">Zpět do knihovny</button>
        </div>
      </div>
    `;
    const wrongBtn = body.querySelector('#wrongBtn');
    if(wrongBtn) wrongBtn.onclick = () => { st.queue = [...st.wrong]; st.wrong = []; st.pointer = 0; st.roundTotal = st.queue.length; st.reviewed = 0; st.flipped = false; st.history = []; render(); };
    body.querySelector('#restartBtn2').onclick = () => { initQueueFromSettings(); render(); };
    body.querySelector('#libBtn').onclick = () => { state.view='library'; state.study=null; render(); };
    return wrap;
  }

  const currentCard = s.cards[st.queue[st.pointer]];
  if(setType === 'quiz' || isQuizCard(currentCard,s)){
    renderQuizStudy(s,st,body);
    return wrap;
  }

  const cardIdx = st.queue[st.pointer];
  const card = s.cards[cardIdx];
  const frontIsTerm = st.settings.front === 'term';
  const frontText = frontIsTerm ? card.term : card.def;
  const backText = stripDuplicateFrontFromBack(frontText,frontIsTerm ? card.def : card.term);
  const frontImage = frontIsTerm ? (card.termImage || card.image) : (card.defImage || card.image);
  const backImage = frontIsTerm ? (card.defImage || card.image) : (card.termImage || card.image);
  const isStarred = (s.starred||[]).includes(cardIdx);

  const stage = document.createElement('div');
  stage.className = 'study-stage';
  stage.innerHTML = `
    <div class="flash-scene">
      <div class="flash-card size-${st.settings.cardSize || 'large'} ${st.settings.flipAnimation===false?'no-flip':''} ${st.flipped?'flipped':''}" id="flashCard">
        <div class="flash-face front">
          <div class="flash-face-top">
            <button class="hint-btn" id="hintBtn">${icon('bulb',16)} Nápověda</button>
            <button class="star-btn ${isStarred?'active':''}" id="starBtn">${icon('star',18)}</button>
          </div>
          <div class="flash-face-content">
            ${frontImage ? `<img src="${frontImage}">` : ''}
            <div class="flash-rich-text">${sanitizeRichText(frontText || '—')}</div>
            ${st.showHint && !st.flipped ? `<div class="flash-hint">Nápověda: ${escapeHtml((backText||'').slice(0, Math.max(3, Math.ceil((backText||'').length/3))))}…</div>` : ''}
          </div>
        </div>
        <div class="flash-face back">
          <div class="flash-face-top">
            <span style="width:18px"></span>
            <button class="star-btn ${isStarred?'active':''}" id="starBtnBack">${icon('star',18)}</button>
          </div>
          <div class="flash-face-content">
            ${backImage ? `<img src="${backImage}">` : ''}
            <div class="flash-rich-text">${sanitizeRichText(backText || '—')}</div>
          </div>
        </div>
      </div>
      ${st.settings.showShortcuts !== false ? `<div class="flash-shortcut-bar"><span class="study-hint-desktop">${icon('drag',15)} Otočení <kbd>mezerník</kbd> · Neumím <kbd>A</kbd> · Umím <kbd>D</kbd></span><span class="study-hint-mobile">Přejetí ← Neumím · Umím → · Klepnutím otočíš</span></div>` : ''}
    </div>
  `;
  body.appendChild(stage);

  const controls = document.createElement('div');
  controls.className = 'study-controls';
  controls.innerHTML = `
    <div class="track-toggle">Sledovat pokrok <button class="switch ${st.settings.trackProgress?'on':''}" id="trackSwitch"><span class="knob"></span></button></div>
    <div class="control-center">
      <button class="round-btn no" id="noBtn">${icon('x',22)}</button>
      <span class="counter">${st.reviewed+1} / ${st.reviewed+st.queue.length}</span>
      <button class="round-btn yes" id="yesBtn">${icon('check',20)}</button>
    </div>
    <div class="control-right">
      <button id="undoBtn" title="Zpět">${icon('undo',18)}</button>
      <button id="shuffleBtn" title="Zamíchat">${icon('shuffle',17)}</button>
      <button id="settingsBtn" title="Nastavení">${icon('gear',18)}</button>
      <button id="fullscreenBtn" title="Celá obrazovka">${icon('expand',17)}</button>
      ${setType==='mixed'?`<button class="btn btn-primary" id="mixedNextBtn">Další otázka ${icon('arrow',16)}</button>`:''}
    </div>
  `;
  body.appendChild(controls);
  wrap.appendChild(layout);

  // interactions
  const flashEl = stage.querySelector('#flashCard');
  stage.querySelectorAll('.flash-face-content img').forEach(image => {
    image.onclick = (e) => { e.stopPropagation(); openImageLightbox(image.src); };
  });
  let touchStart = null;
  let suppressCardClick = false;
  flashEl.onclick = () => {
    if(suppressCardClick){ suppressCardClick = false; return; }
    st.flipped = !st.flipped;
    if(st.settings.tts) speak(st.flipped ? backText : frontText);
    flashEl.classList.toggle('flipped', st.flipped);
  };
  stage.querySelector('#hintBtn').onclick = (e) => { e.stopPropagation(); st.showHint = !st.showHint; render(); };
  const toggleStar = (e) => {
    e.stopPropagation();
    s.starred = s.starred || [];
    const i = s.starred.indexOf(cardIdx);
    if(i>=0) s.starred.splice(i,1); else s.starred.push(cardIdx);
    saveSets();
    render();
  };
  stage.querySelector('#starBtn').onclick = toggleStar;
  const starBack = stage.querySelector('#starBtnBack');
  if(starBack) starBack.onclick = toggleStar;

  function pushHistory(){
    st.history.push({ queue:[...st.queue], pointer: st.pointer, roundTotal:st.roundTotal, reviewed:st.reviewed });
    if(st.history.length>50) st.history.shift();
  }
  function advance(knew){
    pushHistory();
    const idx = st.queue[st.pointer];
    st.queue.splice(st.pointer,1);
    st.reviewed += 1;
    if(!knew && st.settings.trackProgress && !st.wrong.includes(idx)) st.wrong.push(idx);
    if(st.pointer >= st.queue.length) st.pointer = 0;
    recordStudyProgress(st.setId, st.queue.length, s.cards.length);
    st.flipped = false;
    st.showHint = false;
    render();
  }
  let swipeLocked = false;
  function swipeAndAdvance(knew, direction){
    if(swipeLocked) return;
    swipeLocked = true;
    flashEl.classList.add(direction === 'left' ? 'swipe-left' : 'swipe-right');
    setTimeout(() => advance(knew), 280);
  }
  flashEl.addEventListener('pointerdown', event => {
    if(event.pointerType !== 'touch' || event.target.closest('button,img')) return;
    touchStart = { id:event.pointerId, x:event.clientX, y:event.clientY };
    flashEl.setPointerCapture(event.pointerId);
  });
  flashEl.addEventListener('pointerup', event => {
    if(!touchStart || event.pointerId !== touchStart.id) return;
    const deltaX = event.clientX - touchStart.x;
    const deltaY = event.clientY - touchStart.y;
    touchStart = null;
    if(Math.abs(deltaX) < 60 || Math.abs(deltaX) < Math.abs(deltaY) * 1.2) return;
    suppressCardClick = true;
    event.preventDefault();
    swipeAndAdvance(deltaX > 0, deltaX > 0 ? 'right' : 'left');
  });
  flashEl.addEventListener('pointercancel', () => { touchStart = null; });
  controls.querySelector('#noBtn').onclick = () => swipeAndAdvance(false, 'left');
  controls.querySelector('#yesBtn').onclick = () => swipeAndAdvance(true, 'right');
  controls.querySelector('#undoBtn').onclick = () => {
    const prev = st.history.pop();
    if(prev){ st.queue = prev.queue; st.pointer = prev.pointer; st.roundTotal = prev.roundTotal; st.reviewed = prev.reviewed; st.flipped=false; render(); }
    else showToast('Není co vrátit.');
  };
  controls.querySelector('#shuffleBtn').onclick = () => {
    for(let i=st.queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [st.queue[i],st.queue[j]]=[st.queue[j],st.queue[i]]; }
    st.pointer = 0; st.flipped=false;
    render();
    showToast('Kartičky zamíchány.');
  };
  controls.querySelector('#settingsBtn').onclick = openStudySettings;
  controls.querySelector('#fullscreenBtn').onclick = () => {
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
    else document.exitFullscreen?.();
  };
  controls.querySelector('#trackSwitch').onclick = (e) => {
    setTrackProgress(!st.settings.trackProgress);
  };
  controls.querySelector('#mixedNextBtn')?.addEventListener('click',()=>advance(true));

  // keyboard shortcuts
  wrap.tabIndex = -1;
  document.onkeydown = (e) => {
    if(state.view !== 'study') return;
    if(e.code === 'Escape'){
      e.preventDefault();
      if(sectionOverlay.classList.contains('is-open')){ closeSectionMenu(); sectionToggle.focus(); }
      else handleEscape();
    }
    else if(e.code === 'Space'){ e.preventDefault(); flashEl.click(); }
    else if(e.code === 'ArrowRight' || e.code === 'KeyD'){
      e.preventDefault();
      e.stopPropagation();
      if(!e.repeat) swipeAndAdvance(true, 'right');
    }
    else if(e.code === 'ArrowLeft' || e.code === 'KeyA'){
      e.preventDefault();
      e.stopPropagation();
      if(!e.repeat) swipeAndAdvance(false, 'left');
    }
  };

  return wrap;
}

function renderQuizStudy(set, study, body){
  const cardIndex = study.queue[study.pointer];
  const sourceCard = set.cards[cardIndex];
  const question = isQuizQuestionCard(sourceCard) ? sourceCard : convertAnkiQuestionFlashcard(sourceCard);
  if(!question) throw new Error('Položku se nepodařilo převést na ABC otázku.');
  const options = Array.isArray(question.options) ? question.options : [];
  const selectedIndex = study.selectedAnswer;
  const stage = document.createElement('div');
  stage.className = `quiz-stage size-${study.settings.cardSize || 'large'}`;
  stage.innerHTML = `
    <div class="quiz-question flash-rich-text">${sanitizeRichText(question.question || '—')}</div>
    ${question.questionImage ? `<img class="quiz-question-image-display" src="${escapeHtml(question.questionImage)}" alt="Obrázek k otázce">` : ''}
    <div class="quiz-options">${options.map((option,index) => {
      const correct = study.answered && option.correct;
      const incorrect = study.answered && index === selectedIndex && !option.correct;
      return `<button type="button" class="quiz-option ${correct?'correct':''} ${incorrect?'incorrect':''}" data-quiz-answer="${index}" ${study.answered?'disabled':''}><strong>${String.fromCharCode(65+index)}.</strong> <span class="quiz-option-content">${escapeHtml(option.text || '')}${option.image?`<img src="${escapeHtml(option.image)}" alt="Obrázek možnosti ${String.fromCharCode(65+index)}">`:''}</span></button>`;
    }).join('')}</div>
    ${study.answered && question.explanation ? `<p class="quiz-explanation" role="status">${escapeHtml(question.explanation)}</p>` : ''}`;
  body.appendChild(stage);
  const questionImage = stage.querySelector('.quiz-question-image-display');
  if(questionImage) questionImage.onclick = () => openImageLightbox(questionImage.src);
  stage.querySelectorAll('.quiz-option-content img').forEach(image=>image.onclick=event=>{
    event.stopPropagation();
    openImageLightbox(image.src);
  });
  stage.querySelectorAll('[data-quiz-answer]').forEach(button => button.onclick = () => {
    const answerIndex = Number(button.dataset.quizAnswer);
    study.selectedAnswer = answerIndex;
    study.answered = true;
    study.answerCorrect = options[answerIndex]?.correct === true;
    render();
  });

  const controls = document.createElement('div');
  controls.className = 'quiz-controls';
  controls.innerHTML = `
    <div class="track-toggle">Sledovat pokrok <button class="switch ${study.settings.trackProgress?'on':''}" id="trackSwitch"><span class="knob"></span></button></div>
    <span class="counter">${study.reviewed+1} / ${study.reviewed+study.queue.length}</span>
    <div class="control-right quiz-control-actions">
      <button id="undoBtn" title="Zpět">${icon('undo',18)}</button>
      <button id="shuffleBtn" title="Zamíchat">${icon('shuffle',17)}</button>
      <button id="settingsBtn" title="Nastavení">${icon('gear',18)}</button>
      <button id="fullscreenBtn" title="Celá obrazovka">${icon('expand',17)}</button>
      <button class="btn btn-primary" id="quizNext" ${study.answered?'':'disabled'}>${study.queue.length===1?'Dokončit':'Další otázka'} ${icon('arrow',16)}</button>
    </div>`;
  body.appendChild(controls);
  controls.querySelector('#quizNext').onclick = () => {
    study.history.push({
      queue:[...study.queue], pointer:study.pointer, roundTotal:study.roundTotal, reviewed:study.reviewed,
      wrong:[...study.wrong], answered:study.answered, selectedAnswer:study.selectedAnswer, answerCorrect:study.answerCorrect,
    });
    if(!study.answerCorrect && study.settings.trackProgress && !study.wrong.includes(cardIndex)) study.wrong.push(cardIndex);
    study.queue.splice(study.pointer,1);
    study.reviewed += 1;
    if(study.pointer >= study.queue.length) study.pointer = 0;
    recordStudyProgress(study.setId,study.queue.length,set.cards.length);
    study.answered = false;
    study.selectedAnswer = null;
    study.answerCorrect = false;
    render();
  };
  controls.querySelector('#undoBtn').onclick = () => {
    const previous = study.history.pop();
    if(previous){ Object.assign(study,previous); render(); }
    else showToast('Není co vrátit.');
  };
  controls.querySelector('#shuffleBtn').onclick = () => {
    for(let index=study.queue.length-1;index>0;index--){ const other=Math.floor(Math.random()*(index+1)); [study.queue[index],study.queue[other]]=[study.queue[other],study.queue[index]]; }
    study.pointer = 0;
    study.answered = false;
    study.selectedAnswer = null;
    render();
    showToast('Otázky zamíchány.');
  };
  controls.querySelector('#settingsBtn').onclick = openStudySettings;
  controls.querySelector('#fullscreenBtn').onclick = () => {
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
    else document.exitFullscreen?.();
  };
  controls.querySelector('#trackSwitch').onclick = () => setTrackProgress(!study.settings.trackProgress);

  body.tabIndex = -1;
  document.onkeydown = event => {
    if(state.view !== 'study') return;
    if(event.code === 'Escape'){ event.preventDefault(); handleEscape(); }
    else if((event.code === 'ArrowRight' || event.code === 'Enter') && study.answered){
      event.preventDefault();
      controls.querySelector('#quizNext').click();
    }
    else if(/^Digit[1-8]$/.test(event.code) && !study.answered){
      const answer = options[Number(event.code.slice(-1))-1];
      if(answer) stage.querySelector(`[data-quiz-answer="${Number(event.code.slice(-1))-1}"]`)?.click();
    }
  };
}

function openImageLightbox(src){
  const overlay = document.createElement('div');
  overlay.className = 'image-lightbox';
  overlay.innerHTML = `<button class="image-lightbox-close" title="Zavřít">${icon('x',18)}</button><img src="${src}" alt="Zvětšený obrázek">`;
  overlay.onclick = (e) => { if(e.target === overlay || e.target.closest('.image-lightbox-close')) overlay.remove(); };
  document.body.appendChild(overlay);
}

/* ============================= MODAL ============================= */
function openModal(innerHtml, wide=false){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal ${wide?'modal-wide':''}">${innerHtml}</div>`;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  overlay.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  document.body.appendChild(overlay);
}

function confirmThemed(message,{title='Potvrdit akci',confirmLabel='Pokračovat',danger=false}={}){
  return new Promise(resolve => {
    const returnFocus = document.activeElement;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay confirm-overlay';
    overlay.innerHTML = `
      <section class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="themedConfirmTitle" aria-describedby="themedConfirmMessage">
        <div class="modal-head"><h2 id="themedConfirmTitle">${escapeHtml(title)}</h2><button type="button" class="modal-close" id="themedConfirmClose" aria-label="Zavřít">${icon('x',16)}</button></div>
        <p class="confirm-message" id="themedConfirmMessage">${escapeHtml(message)}</p>
        <div class="class-modal-actions"><button type="button" class="btn btn-ghost" id="themedConfirmCancel">Zrušit</button><button type="button" class="btn ${danger?'btn-danger':'btn-primary'}" id="themedConfirmAccept">${escapeHtml(confirmLabel)}</button></div>
      </section>`;
    let settled = false;
    const finish = accepted => {
      if(settled) return;
      settled = true;
      overlay.remove();
      if(returnFocus?.isConnected) returnFocus.focus({ preventScroll:true });
      resolve(accepted);
    };
    overlay.addEventListener('click',event=>{ if(event.target===overlay) finish(false); });
    overlay.addEventListener('keydown',event=>{
      if(event.key==='Escape'){ event.preventDefault(); event.stopPropagation(); finish(false); }
      if(event.key==='Enter' && event.target.tagName!=='TEXTAREA'){ event.preventDefault(); finish(true); }
    });
    overlay.querySelector('#themedConfirmClose').onclick = () => finish(false);
    overlay.querySelector('#themedConfirmCancel').onclick = () => finish(false);
    overlay.querySelector('#themedConfirmAccept').onclick = () => finish(true);
    document.body.appendChild(overlay);
    overlay.querySelector('#themedConfirmAccept').focus();
  });
}

function closeModal(){
  document.getElementById('modalOverlay')?.remove();
}

function handleEscape(){
  const confirmation = document.querySelector('.confirm-overlay');
  if(confirmation){
    confirmation.querySelector('#themedConfirmCancel')?.click();
    return;
  }
  const modal = document.getElementById('modalOverlay');
  if(modal){ closeModal(); return; }
  const lightbox = document.querySelector('.image-lightbox');
  if(lightbox){ lightbox.remove(); return; }
  const sectionOverlay = document.querySelector('.study-section-overlay.is-open');
  if(sectionOverlay){
    sectionOverlay.classList.remove('is-open');
    sectionOverlay.setAttribute('aria-hidden','true');
    const toggle = document.getElementById('studySectionToggle');
    toggle?.setAttribute('aria-expanded','false');
    toggle?.focus();
    return;
  }
  if(state.view === 'study'){
    state.view = 'library';
    state.study = null;
    render();
  }else if(state.view === 'create'){
    state.view = draftReturnView;
    state.adminEditingSet = null;
    draft = null;
    state.editingSetId = null;
    render();
  }
}
